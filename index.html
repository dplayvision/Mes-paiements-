<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f5f7">
<title>Mes paiements</title>
<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}
body {
    margin: 0;
    background: #f5f5f7;
    color: #111;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Arial, sans-serif;
}
.app {
    max-width: 680px;
    margin: auto;
    padding: 20px 15px 50px;
}
h1 {
    text-align: center;
    margin: 10px 0 20px;
}
h2 {
    margin-top: 0;
}
.card {
    background: white;
    border-radius: 20px;
    padding: 18px;
    margin-bottom: 15px;
    box-shadow: 0 2px 10px rgba(0,0,0,.06);
}
.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
}
.stat {
    background: #f2f2f7;
    border-radius: 14px;
    padding: 12px 5px;
    text-align: center;
}
.stat span {
    display: block;
    color: #666;
    font-size: 13px;
}
.stat strong {
    display: block;
    font-size: 18px;
    margin-top: 5px;
}
.primary,
.secondary,
.danger {
    border: 0;
    border-radius: 13px;
    padding: 13px;
    font-size: 16px;
    cursor: pointer;
}
.primary {
    width: 100%;
    background: #007aff;
    color: white;
}
.secondary {
    background: #e5e5ea;
    color: #111;
}
.danger {
    background: #ff3b30;
    color: white;
}
label {
    display: block;
    margin-top: 13px;
    margin-bottom: 6px;
    font-size: 14px;
    color: #444;
}
input,
select {
    width: 100%;
    padding: 13px;
    border: 1px solid #d5d5d5;
    border-radius: 12px;
    background: white;
    font-size: 16px;
}
#form {
    display: none;
}
.hidden {
    display: none !important;
}
/* Paiement */
.payment {
    background: white;
    border-radius: 20px;
    padding: 17px;
    margin-bottom: 15px;
    box-shadow: 0 2px 10px rgba(0,0,0,.06);
}
.payment-title {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
}
.payment-title h3 {
    margin: 0;
    font-size: 19px;
}
.payment-total {
    font-weight: 700;
    white-space: nowrap;
}
.payment-info {
    color: #666;
    font-size: 14px;
    margin-top: 7px;
}
/* Echéances */
.installments {
    margin-top: 15px;
    border-top: 1px solid #eee;
}
.installment {
    display: grid;
    grid-template-columns: 32px 1fr auto 42px;
    align-items: center;
    gap: 8px;
    padding: 13px 0;
    border-bottom: 1px solid #eee;
}
.installment:last-child {
    border-bottom: 0;
}
.installment.paid {
    opacity: .55;
}
.installment-checkbox {
    width: 24px;
    height: 24px;
    margin: 0;
    accent-color: #34c759;
}
.installment-main {
    min-width: 0;
}
.installment-number {
    font-weight: 700;
}
.installment-date {
    color: #666;
    font-size: 13px;
    margin-top: 3px;
}
.installment-communication {
    color: #666;
    font-size: 13px;
    margin-top: 3px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.installment-amount {
    font-weight: 700;
    white-space: nowrap;
}
.edit-installment {
    width: 38px;
    height: 38px;
    padding: 0;
    border: 0;
    border-radius: 10px;
    background: #e5e5ea;
    font-size: 18px;
}
.installment-summary {
    border-top: 1px solid #ddd;
    margin-top: 5px;
    padding-top: 12px;
    font-size: 14px;
    color: #666;
}
.payment-actions {
    display: flex;
    gap: 8px;
    margin-top: 13px;
}
.payment-actions button {
    flex: 1;
}
/* Aperçu */
.preview {
    background: #f2f2f7;
    border-radius: 14px;
    padding: 12px;
    margin-top: 12px;
}
.preview-row {
    display: flex;
    justify-content: space-between;
    padding: 7px 0;
    border-bottom: 1px solid #ddd;
}
.preview-row:last-child {
    border-bottom: 0;
}
/* PIN */
#login {
    max-width: 400px;
    margin: 80px auto;
    padding: 15px;
}
.pin {
    text-align: center;
    font-size: 28px;
    letter-spacing: 8px;
}
.error {
    color: #ff3b30;
    text-align: center;
}
.empty {
    text-align: center;
    color: #777;
    padding: 25px;
}
</style>
</head>
<body>
<!-- ================= PIN ================= -->
<div id="login">
    <div class="card">
        <h1>Mes paiements</h1>
        <p style="text-align:center;">
            Entrez votre code PIN
        </p>
        <input
            id="pin"
            class="pin"
            type="password"
            inputmode="numeric"
            maxlength="4"
            placeholder="••••"
        >
        <br><br>
        <button class="primary" onclick="unlock()">
            Ouvrir
        </button>
        <p id="pinError" class="error"></p>
    </div>
</div>
<!-- ================= APPLICATION ================= -->
<div id="app" class="app" style="display:none;">
    <h1>Mes paiements</h1>
    <!-- STATISTIQUES -->
    <div class="card">
        <div class="stats">
            <div class="stat">
                <span>Total</span>
                <strong id="total">0,00 €</strong>
            </div>
            <div class="stat">
                <span>Payé</span>
                <strong id="paid">0,00 €</strong>
            </div>
            <div class="stat">
                <span>Reste</span>
                <strong id="remaining">0,00 €</strong>
            </div>
        </div>
    </div>
    <!-- AJOUT -->
    <button class="primary" onclick="openForm()">
        ＋ Ajouter un paiement
    </button>
    <br><br>
    <!-- LISTE -->
    <div id="payments"></div>
    <!-- ================= FORMULAIRE ================= -->
    <div id="form" class="card">
        <h2 id="formTitle">
            Ajouter un paiement
        </h2>
        <label>Nom du paiement</label>
        <input
            id="name"
            type="text"
            placeholder="Ex. Crédit voiture"
        >
        <label>Type de paiement</label>
        <select id="type" onchange="updateType()">
            <option value="monthly">
                Paiement mensuel
            </option>
            <option value="multiple">
                Paiement en plusieurs échéances
            </option>
        </select>
        <!-- MENSUEL -->
        <div id="monthlyFields">
            <label>Montant mensuel</label>
            <input
                id="amount"
                type="number"
                step="0.01"
                placeholder="0,00"
            >
            <label>Jour de paiement</label>
            <input
                id="day"
                type="number"
                min="1"
                max="31"
                placeholder="Ex. 15"
            >
        </div>
        <!-- PLUSIEURS ECHEANCES -->
        <div id="multipleFields" class="hidden">
            <label>Montant total</label>
            <input
                id="totalAmount"
                type="number"
                step="0.01"
                placeholder="Ex. 12000"
                oninput="previewInstallments()"
            >
            <label>Nombre d'échéances</label>
            <input
                id="installments"
                type="number"
                min="1"
                placeholder="Ex. 5"
                oninput="previewInstallments()"
            >
            <label>Première date d'échéance</label>
            <input
                id="firstDate"
                type="date"
                onchange="previewInstallments()"
            >
            <div id="preview"></div>
        </div>
        <label>Bénéficiaire</label>
        <input
            id="beneficiary"
            type="text"
            placeholder="Nom du bénéficiaire"
        >
        <label>Communication</label>
        <input
            id="communication"
            type="text"
            placeholder="Communication"
        >
        <br>
        <button class="primary" onclick="savePayment()">
            Enregistrer
        </button>
        <br><br>
        <button
            class="secondary"
            style="width:100%;"
            onclick="closeForm()"
        >
            Annuler
        </button>
    </div>
</div>
<script>
/* =========================================================
   CONFIGURATION
========================================================= */
const PIN = "1157";
let payments =
    JSON.parse(
        localStorage.getItem("mesPaiements") || "[]"
    );
let editingId = null;
/* =========================================================
   SAUVEGARDE
========================================================= */
function saveData() {
    localStorage.setItem(
        "mesPaiements",
        JSON.stringify(payments)
    );
}
/* =========================================================
   FORMAT EURO
========================================================= */
function euro(value) {
    return Number(value || 0).toLocaleString(
        "fr-BE",
        {
            style: "currency",
            currency: "EUR"
        }
    );
}
/* =========================================================
   FORMAT DATE
========================================================= */
function formatDate(date) {
    if (!date) return "";
    const d =
        new Date(date + "T12:00:00");
    return d.toLocaleDateString(
        "fr-BE",
        {
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
        }
    );
}
/* =========================================================
   PIN
========================================================= */
function unlock() {
    const entered =
        document.getElementById("pin").value;
    if (entered === PIN) {
        document.getElementById("login")
            .style.display = "none";
        document.getElementById("app")
            .style.display = "block";
        render();
    } else {
        document.getElementById("pinError")
            .textContent =
            "Code PIN incorrect";
    }
}
/* =========================================================
   TYPE DE PAIEMENT
========================================================= */
function updateType() {
    const type =
        document.getElementById("type").value;
    const multiple =
        type === "multiple";
    document.getElementById("monthlyFields")
        .classList.toggle(
            "hidden",
            multiple
        );
    document.getElementById("multipleFields")
        .classList.toggle(
            "hidden",
            !multiple
        );
    if (multiple) {
        previewInstallments();
    }
}
/* =========================================================
   OUVRIR FORMULAIRE
========================================================= */
function openForm(id = null) {
    editingId = id;
    document.getElementById("form")
        .style.display = "block";
    if (id === null) {
        document.getElementById("formTitle")
            .textContent =
            "Ajouter un paiement";
        clearForm();
    } else {
        const payment =
            payments.find(
                p => p.id === id
            );
        if (!payment) return;
        document.getElementById("formTitle")
            .textContent =
            "Modifier le paiement";
        document.getElementById("name")
            .value =
            payment.name || "";
        document.getElementById("type")
            .value =
            payment.type || "monthly";
        document.getElementById("beneficiary")
            .value =
            payment.beneficiary || "";
        document.getElementById("communication")
            .value =
            payment.communication || "";
        if (payment.type === "monthly") {
            document.getElementById("amount")
                .value =
                payment.amount || "";
            document.getElementById("day")
                .value =
                payment.day || "";
        } else {
            document.getElementById("totalAmount")
                .value =
                payment.totalAmount || "";
            document.getElementById("installments")
                .value =
                payment.installments || "";
            document.getElementById("firstDate")
                .value =
                payment.firstDate || "";
        }
        updateType();
    }
    window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
    });
}
/* =========================================================
   VIDER FORMULAIRE
========================================================= */
function clearForm() {
    [
        "name",
        "amount",
        "day",
        "totalAmount",
        "installments",
        "firstDate",
        "beneficiary",
        "communication"
    ].forEach(id => {
        document.getElementById(id).value = "";
    });
    document.getElementById("type")
        .value = "monthly";
    updateType();
}
/* =========================================================
   FERMER FORMULAIRE
========================================================= */
function closeForm() {
    document.getElementById("form")
        .style.display = "none";
    editingId = null;
}
/* =========================================================
   CALCUL DES ECHEANCES
========================================================= */
function calculateInstallments() {
    const total =
        parseFloat(
            document.getElementById("totalAmount").value
        ) || 0;
    const count =
        parseInt(
            document.getElementById("installments").value
        ) || 0;
    const firstDate =
        document.getElementById("firstDate").value;
    const communication =
        document.getElementById("communication").value
        .trim();
    if (
        total <= 0 ||
        count <= 0 ||
        !firstDate
    ) {
        return [];
    }
    /*
       Calcul en centimes pour éviter
       les problèmes d'arrondi.
    */
    const totalCents =
        Math.round(total * 100);
    const base =
        Math.floor(totalCents / count);
    const difference =
        totalCents - (base * count);
    const result = [];
    for (let i = 0; i < count; i++) {
        const date =
            new Date(
                firstDate + "T12:00:00"
            );
        date.setMonth(
            date.getMonth() + i
        );
        const dateString =
            date.getFullYear() +
            "-" +
            String(
                date.getMonth() + 1
            ).padStart(2, "0") +
            "-" +
            String(
                date.getDate()
            ).padStart(2, "0");
        /*
           La différence éventuelle de centimes
           est ajoutée à la dernière échéance.
        */
        const cents =
            base +
            (
                i === count - 1
                ? difference
                : 0
            );
        result.push({
            number: i + 1,
            amount:
                cents / 100,
            date:
                dateString,
            communication:
                communication,
            paid:
                false
        });
    }
    return result;
}
/* =========================================================
   APERCU ECHEANCES
========================================================= */
function previewInstallments() {
    const preview =
        document.getElementById("preview");
    const list =
        calculateInstallments();
    if (!list.length) {
        preview.innerHTML = "";
        return;
    }
    let html =
        '<div class="preview">' +
        "<strong>Échéances générées</strong>";
    list.forEach(item => {
        html += `
            <div class="preview-row">
                <span>
                    ${item.number}/${list.length}
                    <br>
                    <small>
                        ${formatDate(item.date)}
                    </small>
                </span>
                <strong>
                    ${euro(item.amount)}
                </strong>
            </div>
        `;
    });
    html += "</div>";
    preview.innerHTML = html;
}
/* =========================================================
   ENREGISTRER
========================================================= */
function savePayment() {
    const name =
        document.getElementById("name")
            .value.trim();
    const type =
        document.getElementById("type")
            .value;
    const beneficiary =
        document.getElementById("beneficiary")
            .value.trim();
    const communication =
        document.getElementById("communication")
            .value.trim();
    if (!name) {
        alert(
            "Veuillez entrer le nom du paiement."
        );
        return;
    }
    /* ================= MENSUEL ================= */
    if (type === "monthly") {
        const amount =
            parseFloat(
                document.getElementById("amount").value
            ) || 0;
        const day =
            parseInt(
                document.getElementById("day").value
            ) || 1;
        if (amount <= 0) {
            alert(
                "Veuillez entrer un montant."
            );
            return;
        }
        const old =
            editingId !== null
            ? payments.find(
                p => p.id === editingId
            )
            : null;
        const payment = {
            id:
                editingId !== null
                ? editingId
                : Date.now(),
            name:
                name,
            type:
                "monthly",
            amount:
                amount,
            day:
                day,
            beneficiary:
                beneficiary,
            communication:
                communication,
            paid:
                old?.paid || {}
        };
        if (editingId !== null) {
            const index =
                payments.findIndex(
                    p => p.id === editingId
                );
            payments[index] = payment;
        } else {
            payments.push(payment);
        }
    }
    /* ================= ECHEANCES ================= */
    else {
        const total =
            parseFloat(
                document.getElementById("totalAmount")
                    .value
            ) || 0;
        const count =
            parseInt(
                document.getElementById("installments")
                    .value
            ) || 0;
        const firstDate =
            document.getElementById("firstDate")
                .value;
        if (
            total <= 0 ||
            count <= 0 ||
            !firstDate
        ) {
            alert(
                "Veuillez remplir le montant total, le nombre d'échéances et la date."
            );
            return;
        }
        const old =
            editingId !== null
            ? payments.find(
                p => p.id === editingId
            )
            : null;
        let list =
            calculateInstallments();
        /*
           Si on modifie un paiement existant,
           on conserve les échéances déjà payées
           et leurs communications.
        */
        if (old?.installmentsList) {
            list.forEach(
                (item, index) => {
                    const previous =
                        old.installmentsList[index];
                    if (previous) {
                        item.paid =
                            previous.paid === true;
                        if (
                            previous.communication !== undefined
                        ) {
                            item.communication =
                                previous.communication;
                        }
                    }
                }
            );
        }
        const payment = {
            id:
                editingId !== null
                ? editingId
                : Date.now(),
            name:
                name,
            type:
                "multiple",
            totalAmount:
                total,
            installments:
                count,
            firstDate:
                firstDate,
            beneficiary:
                beneficiary,
            communication:
                communication,
            installmentsList:
                list
        };
        if (editingId !== null) {
            const index =
                payments.findIndex(
                    p => p.id === editingId
                );
            payments[index] = payment;
        } else {
            payments.push(payment);
        }
    }
    saveData();
    closeForm();
    render();
}
/* =========================================================
   AFFICHAGE PRINCIPAL
========================================================= */
function render() {
    const container =
        document.getElementById("payments");
    container.innerHTML = "";
    /*
       IMPORTANT :
       On calcule ici les trois montants
       sur l'ensemble des paiements.
    */
    let total = 0;
    let paid = 0;
    payments.forEach(payment => {
        /* ---------- MENSUEL ---------- */
        if (payment.type === "monthly") {
            /*
               Pour un paiement mensuel,
               on affiche le montant comme
               montant prévu.
            */
            total +=
                Number(payment.amount) || 0;
            /*
               On utilise le mois actuel
               pour déterminer s'il est payé.
            */
            const key =
                getCurrentMonthKey();
            if (
                payment.paid &&
                payment.paid[key] === true
            ) {
                paid +=
                    Number(payment.amount) || 0;
            }
            container.appendChild(
                createMonthlyCard(payment)
            );
        }
        /* ---------- ECHEANCES ---------- */
        else {
            const list =
                payment.installmentsList || [];
            /*
               TOUTES les échéances sont affichées.
               Elles ne sont plus filtrées par mois.
            */
            list.forEach(item => {
                total +=
                    Number(item.amount) || 0;
                if (item.paid === true) {
                    paid +=
                        Number(item.amount) || 0;
                }
            });
            container.appendChild(
                createMultipleCard(payment)
            );
        }
    });
    const remaining =
        Math.max(0, total - paid);
    document.getElementById("total")
        .textContent =
        euro(total);
    document.getElementById("paid")
        .textContent =
        euro(paid);
    document.getElementById("remaining")
        .textContent =
        euro(remaining);
    if (!payments.length) {
        container.innerHTML =
            '<div class="card empty">' +
            "Aucun paiement enregistré." +
            "</div>";
    }
}
/* =========================================================
   MOIS ACTUEL
========================================================= */
function getCurrentMonthKey() {
    const d = new Date();
    return d.getFullYear() +
        "-" +
        String(
            d.getMonth() + 1
        ).padStart(2, "0");
}
/* =========================================================
   CARTE MENSUELLE
========================================================= */
function createMonthlyCard(payment) {
    const div =
        document.createElement("div");
    div.className = "payment";
    const key =
        getCurrentMonthKey();
    const isPaid =
        payment.paid &&
        payment.paid[key] === true;
    if (isPaid) {
        div.classList.add("paid");
    }
    div.innerHTML = `
        <div class="payment-title">
            <div>
                <h3>
                    ${escapeHtml(payment.name)}
                </h3>
                <div class="payment-info">
                    Paiement mensuel —
                    le ${payment.day}
                </div>
            </div>
            <div class="payment-total">
                ${euro(payment.amount)}
            </div>
        </div>
        ${
            payment.beneficiary
            ? `
                <div class="payment-info">
                    Bénéficiaire :
                    ${escapeHtml(payment.beneficiary)}
                </div>
            `
            : ""
        }
        ${
            payment.communication
            ? `
                <div class="payment-info">
                    Communication :
                    ${escapeHtml(payment.communication)}
                </div>
            `
            : ""
        }
        <div class="payment-actions">
            <button
                class="secondary"
                onclick="
                    toggleMonthlyPaid(${payment.id})
                "
            >
                ${
                    isPaid
                    ? "☑ Payé"
                    : "☐ Marquer payé"
                }
            </button>
        </div>
        <div class="payment-actions">
            <button
                class="secondary"
                onclick="
                    openForm(${payment.id})
                "
            >
                ✏️ Modifier
            </button>
            <button
                class="danger"
                onclick="
                    deletePayment(${payment.id})
                "
            >
                Supprimer
            </button>
        </div>
    `;
    return div;
}
/* =========================================================
   CARTE AVEC ECHEANCES
========================================================= */
function createMultipleCard(payment) {
    const div =
        document.createElement("div");
    div.className = "payment";
    let html = `
        <div class="payment-title">
            <div>
                <h3>
                    ${escapeHtml(payment.name)}
                </h3>
                <div class="payment-info">
                    ${payment.installments}
                    échéances
                </div>
            </div>
            <div class="payment-total">
                ${euro(payment.totalAmount)}
            </div>
        </div>
        ${
            payment.beneficiary
            ? `
                <div class="payment-info">
                    Bénéficiaire :
                    ${escapeHtml(payment.beneficiary)}
                </div>
            `
            : ""
        }
        <div class="installments">
    `;
    const list =
        payment.installmentsList || [];
    list.forEach(
        (item, index) => {
            html += `
                <div
                    class="installment
                    ${item.paid ? "paid" : ""}"
                >
                    <input
                        class="installment-checkbox"
                        type="checkbox"
                        ${
                            item.paid
                            ? "checked"
                            : ""
                        }
                        onchange="
                            toggleInstallment(
                                ${payment.id},
                                ${index}
                            )
                        "
                    >
                    <div class="installment-main">
                        <div class="installment-number">
                            ${
                                item.paid
                                ? "✓ "
                                : ""
                            }
                            Échéance
                            ${item.number}/${payment.installments}
                        </div>
                        <div class="installment-date">
                            📅
                            ${formatDate(item.date)}
                        </div>
                        <div
                            class="installment-communication"
                        >
                            💬
                            ${
                                escapeHtml(
                                    item.communication ||
                                    "Aucune communication"
                                )
                            }
                        </div>
                    </div>
                    <div class="installment-amount">
                        ${euro(item.amount)}
                    </div>
                    <button
                        class="edit-installment"
                        title="Modifier cette échéance"
                        onclick="
                            editInstallment(
                                ${payment.id},
                                ${index}
                            )
                        "
                    >
                        ✏️
                    </button>
                </div>
            `;
        }
    );
    const paidList =
        list.filter(
            item => item.paid === true
        );
    const paidAmount =
        paidList.reduce(
            (sum, item) =>
                sum + Number(item.amount || 0),
            0
        );
    html += `
        </div>
        <div class="installment-summary">
            <strong>
                ${paidList.length}/${list.length}
                échéances payées
            </strong>
            <br>
            ${euro(paidAmount)}
            payé sur
            ${euro(payment.totalAmount)}
        </div>
        <div class="payment-actions">
            <button
                class="secondary"
                onclick="
                    openForm(${payment.id})
                "
            >
                ✏️ Modifier le paiement
            </button>
            <button
                class="danger"
                onclick="
                    deletePayment(${payment.id})
                "
            >
                Supprimer
            </button>
        </div>
    `;
    div.innerHTML = html;
    return div;
}
/* =========================================================
   COCHER UNE ECHEANCE
========================================================= */
function toggleInstallment(
    paymentId,
    installmentIndex
) {
    const payment =
        payments.find(
            p => p.id === paymentId
        );
    if (!payment) return;
    if (
        !payment.installmentsList ||
        !payment.installmentsList[installmentIndex]
    ) {
        return;
    }
    /*
       IMPORTANT :
       On modifie uniquement l'échéance
       sélectionnée.
    */
    payment.installmentsList[
        installmentIndex
    ].paid =
        !payment.installmentsList[
            installmentIndex
        ].paid;
    saveData();
    render();
}
/* =========================================================
   MODIFIER UNE ECHEANCE
========================================================= */
function editInstallment(
    paymentId,
    installmentIndex
) {
    const payment =
        payments.find(
            p => p.id === paymentId
        );
    if (!payment) return;
    const item =
        payment.installmentsList[
            installmentIndex
        ];
    if (!item) return;
    /* DATE */
    const newDate =
        prompt(
            "Date de l'échéance (AAAA-MM-JJ)",
            item.date
        );
    if (newDate === null) return;
    if (
        !/^\d{4}-\d{2}-\d{2}$/.test(
            newDate
        )
    ) {
        alert(
            "Format de date incorrect.\n\nUtilisez AAAA-MM-JJ."
        );
        return;
    }
    /* MONTANT */
    const newAmount =
        prompt(
            "Montant de cette échéance (€)",
            String(item.amount)
                .replace(".", ",")
        );
    if (newAmount === null) return;
    const amount =
        parseFloat(
            newAmount.replace(",", ".")
        );
    if (
        isNaN(amount) ||
        amount < 0
    ) {
        alert(
            "Montant incorrect."
        );
        return;
    }
    /* COMMUNICATION */
    const newCommunication =
        prompt(
            "Communication de cette échéance",
            item.communication || ""
        );
    if (newCommunication === null) return;
    /* SAUVEGARDE */
    item.date =
        newDate;
    item.amount =
        Math.round(amount * 100) / 100;
    item.communication =
        newCommunication;
    /*
       Le statut payé n'est PAS modifié.
    */
    saveData();
    render();
}
/* =========================================================
   PAIEMENT MENSUEL
========================================================= */
function toggleMonthlyPaid(id) {
    const payment =
        payments.find(
            p => p.id === id
        );
    if (!payment) return;
    if (!payment.paid) {
        payment.paid = {};
    }
    const key =
        getCurrentMonthKey();
    payment.paid[key] =
        !payment.paid[key];
    saveData();
    render();
}
/* =========================================================
   SUPPRIMER
========================================================= */
function deletePayment(id) {
    const confirmed =
        confirm(
            "Supprimer ce paiement et toutes ses échéances ?"
        );
    if (!confirmed) return;
    payments =
        payments.filter(
            p => p.id !== id
        );
    saveData();
    render();
}
/* =========================================================
   SECURITE AFFICHAGE
========================================================= */
function escapeHtml(text) {
    return String(text || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}
/* =========================================================
   TOUCHE ENTREE DU PIN
========================================================= */
document.getElementById("pin")
    .addEventListener(
        "keydown",
        function(event) {
            if (event.key === "Enter") {
                unlock();
            }
        }
    );
</script>
