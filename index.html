<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mes paiements</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f2f2f7;
  color: #111;
}

header {
  background: #007aff;
  color: white;
  padding: 20px 16px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 26px;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 15px;
}

.card {
  background: white;
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 15px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

input, select, button {
  width: 100%;
  padding: 13px;
  margin-top: 8px;
  border-radius: 10px;
  border: 1px solid #ccc;
  font-size: 16px;
}

button {
  border: none;
  background: #007aff;
  color: white;
  font-weight: 600;
}

button.secondary {
  background: #e5e5ea;
  color: #111;
}

button.danger {
  background: #ff3b30;
}

button.green {
  background: #34c759;
}

button.small {
  width: auto;
  padding: 9px 12px;
  margin: 0;
  font-size: 14px;
}

.summary {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 15px;
}

.summaryBox {
  background: white;
  border-radius: 14px;
  padding: 12px 6px;
  text-align: center;
  box-shadow: 0 2px 7px rgba(0,0,0,.07);
}

.summaryBox strong {
  display: block;
  font-size: 18px;
  margin-top: 5px;
}

.sectionTitle {
  font-size: 21px;
  font-weight: 700;
  margin: 22px 0 10px;
}

.payment {
  background: white;
  border-radius: 16px;
  padding: 15px;
  margin-bottom: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.payment.paid {
  border-left: 5px solid #34c759;
}

.paymentHeader {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
}

.paymentName {
  font-size: 18px;
  font-weight: 700;
}

.installment {
  margin-top: 12px;
  padding: 12px;
  background: #f2f2f7;
  border-radius: 12px;
}

.installment.paid {
  background: #e9f9ed;
}

.installmentTop {
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

.amount {
  font-size: 18px;
  font-weight: 700;
}

.details {
  margin-top: 7px;
  font-size: 14px;
  line-height: 1.5;
}

.actions {
  display: flex;
  gap: 7px;
  margin-top: 10px;
  flex-wrap: wrap;
}

.actions button {
  width: auto;
}

.empty {
  text-align: center;
  color: #777;
  padding: 20px;
}

#app {
  display: none;
}

.modal {
  display: none;
  position: fixed;
  z-index: 1000;
  inset: 0;
  background: rgba(0,0,0,.45);
  padding: 20px;
  overflow-y: auto;
}

.modalContent {
  background: white;
  max-width: 500px;
  margin: 40px auto;
  border-radius: 18px;
  padding: 20px;
}

.modalContent h2 {
  margin-top: 0;
}

.close {
  background: #e5e5ea;
  color: #111;
}

.login {
  max-width: 400px;
  margin: 80px auto;
  padding: 20px;
}

.error {
  color: #ff3b30;
  text-align: center;
  margin-top: 10px;
}

.checkboxLine {
  display: flex;
  align-items: center;
  gap: 8px;
}

.checkboxLine input {
  width: 22px;
  height: 22px;
  margin: 0;
}

.badge {
  display: inline-block;
  padding: 4px 8px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 600;
  background: #e5e5ea;
}

.badge.paid {
  background: #d9f7df;
  color: #16863a;
}

.badge.unpaid {
  background: #fff0d9;
  color: #a85b00;
}
</style>
</head>

<body>

<div id="loginScreen" class="login">
  <div class="card">
    <h1>💳 Mes paiements</h1>
    <p>Entrez votre code PIN</p>

    <input
      type="password"
      id="pinInput"
      inputmode="numeric"
      maxlength="4"
      placeholder="Code PIN"
    >

    <button onclick="checkPin()">Ouvrir</button>

    <div id="pinError" class="error"></div>
  </div>
</div>

<div id="app">

<header>
  <h1>💳 Mes paiements</h1>
</header>

<div class="container">

  <div class="summary">
    <div class="summaryBox">
      Total
      <strong id="totalAmount">0,00 €</strong>
    </div>

    <div class="summaryBox">
      Payé
      <strong id="paidAmount">0,00 €</strong>
    </div>

    <div class="summaryBox">
      Reste
      <strong id="remainingAmount">0,00 €</strong>
    </div>
  </div>

  <div class="card">
    <h2>➕ Nouveau paiement</h2>

    <input id="beneficiary" placeholder="Bénéficiaire">

    <input
      id="totalInput"
      type="number"
      step="0.01"
      placeholder="Montant total (€)"
    >

    <input
      id="installmentsInput"
      type="number"
      min="1"
      placeholder="Nombre d'échéances"
    >

    <input
      id="firstDate"
      type="date"
    >

    <input
      id="communication"
      placeholder="Communication"
    >

    <button onclick="addPayment()">Ajouter le paiement</button>
  </div>

  <div class="card">
    <h2>💾 Sauvegarde</h2>

    <button onclick="exportData()">📤 Exporter</button>

    <input
      type="file"
      id="importFile"
      accept=".json,application/json"
      style="display:none"
      onchange="importData(event)"
    >

    <button
      class="secondary"
      onclick="document.getElementById('importFile').click()"
    >
      📥 Importer
    </button>
  </div>

  <div class="sectionTitle">💰 À payer</div>
  <div id="unpaidList"></div>

  <div class="sectionTitle">✅ Payé</div>
  <div id="paidList"></div>

</div>
</div>

<!-- MODALE ÉDITION -->

<div id="editModal" class="modal">

  <div class="modalContent">

    <h2>✏️ Modifier l'échéance</h2>

    <input id="editDate" type="date">

    <input
      id="editAmount"
      type="number"
      step="0.01"
      placeholder="Montant"
    >

    <input
      id="editCommunication"
      placeholder="Communication"
    >

    <button onclick="saveEdit()">💾 Sauvegarder</button>

    <button
      class="close"
      onclick="closeEdit()"
    >
      Annuler
    </button>

  </div>

</div>

<script>

const PIN = "1157";
const STORAGE_KEY = "mesPaiements";
const BACKUP_VERSION = 1;

let payments = [];
let editingPaymentId = null;
let editingInstallmentIndex = null;


/* =========================
   OUTILS
========================= */

function euro(value) {
  return Number(value || 0).toLocaleString("fr-BE", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  }) + " €";
}

function generateId() {
  return Date.now().toString() + Math.random().toString(16).slice(2);
}

function formatDate(dateString) {
  if (!dateString) return "-";

  const date = new Date(dateString + "T00:00:00");

  return date.toLocaleDateString("fr-BE");
}


/* =========================
   NORMALISATION
========================= */

function normalizeData(data) {

  if (!Array.isArray(data)) {
    return [];
  }

  return data.map(payment => {

    if (!payment.id) {
      payment.id = generateId();
    }

    if (!payment.beneficiary) {
      payment.beneficiary = "";
    }

    if (!Array.isArray(payment.installments)) {
      payment.installments = [];
    }

    payment.installments = payment.installments.map((item, index) => {

      return {
        date: item.date || "",
        amount: Number(item.amount || 0),
        communication: item.communication || payment.communication || "",
        paid: item.paid === true,
        number: item.number || index + 1
      };

    });

    payment.totalAmount = payment.installments.reduce(
      (sum, item) => sum + Number(item.amount || 0),
      0
    );

    return payment;

  });
}


/* =========================
   CHARGEMENT
========================= */

function loadData() {

  try {

    const saved = localStorage.getItem(STORAGE_KEY);

    if (saved) {
      payments = normalizeData(JSON.parse(saved));
    }

  } catch (error) {

    console.error(error);
    payments = [];

  }

  render();
}


/* =========================
   SAUVEGARDE
========================= */

function saveData() {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(payments)
  );

  render();
}


/* =========================
   PIN
========================= */

function checkPin() {

  const value =
    document.getElementById("pinInput").value;

  if (value === PIN) {

    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("app").style.display = "block";

    loadData();

  } else {

    document.getElementById("pinError").textContent =
      "Code PIN incorrect";

  }
}

document
  .getElementById("pinInput")
  .addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
      checkPin();
    }

  });


/* =========================
   AJOUT PAIEMENT
========================= */

function addPayment() {

  const beneficiary =
    document.getElementById("beneficiary").value.trim();

  const total =
    Number(document.getElementById("totalInput").value);

  const count =
    Number(document.getElementById("installmentsInput").value);

  const firstDate =
    document.getElementById("firstDate").value;

  const communication =
    document.getElementById("communication").value.trim();

  if (!beneficiary) {
    alert("Veuillez entrer un bénéficiaire.");
    return;
  }

  if (!total || total <= 0) {
    alert("Veuillez entrer un montant.");
    return;
  }

  if (!count || count < 1) {
    alert("Veuillez entrer le nombre d'échéances.");
    return;
  }

  if (!firstDate) {
    alert("Veuillez choisir une date.");
    return;
  }


  /*
     Répartition exacte des centimes
     Exemple :
     1000 € / 3
     = 333,33
     = 333,33
     = 333,34
  */

  const totalCents =
    Math.round(total * 100);

  const baseCents =
    Math.floor(totalCents / count);

  const remainder =
    totalCents % count;

  const installments = [];

  for (let i = 0; i < count; i++) {

    let cents = baseCents;

    if (i === count - 1) {
      cents += remainder;
    }

    installments.push({

      number: i + 1,

      date: addMonths(firstDate, i),

      amount: cents / 100,

      communication: communication,

      paid: false

    });

  }


  payments.push({

    id: generateId(),

    beneficiary: beneficiary,

    totalAmount: total,

    installments: installments

  });


  saveData();


  document.getElementById("beneficiary").value = "";
  document.getElementById("totalInput").value = "";
  document.getElementById("installmentsInput").value = "";
  document.getElementById("firstDate").value = "";
  document.getElementById("communication").value = "";
}


/* =========================
   AJOUT MOIS
========================= */

function addMonths(dateString, months) {

  const date = new Date(
    dateString + "T00:00:00"
  );

  const originalDay = date.getDate();

  date.setDate(1);

  date.setMonth(
    date.getMonth() + months
  );

  const lastDay =
    new Date(
      date.getFullYear(),
      date.getMonth() + 1,
      0
    ).getDate();

  date.setDate(
    Math.min(originalDay, lastDay)
  );

  const year =
    date.getFullYear();

  const month =
    String(date.getMonth() + 1).padStart(2, "0");

  const day =
    String(date.getDate()).padStart(2, "0");

  return `${year}-${month}-${day}`;
}


/* =========================
   AFFICHAGE
========================= */

function render() {

  const unpaidList =
    document.getElementById("unpaidList");

  const paidList =
    document.getElementById("paidList");

  if (!unpaidList || !paidList) {
    return;
  }

  unpaidList.innerHTML = "";
  paidList.innerHTML = "";


  let total = 0;
  let paid = 0;


  payments.forEach(payment => {

    payment.installments.forEach(item => {

      total += Number(item.amount || 0);

      if (item.paid) {
        paid += Number(item.amount || 0);
      }

    });

  });


  const remaining =
    Math.max(0, total - paid);


  document.getElementById("totalAmount").textContent =
    euro(total);

  document.getElementById("paidAmount").textContent =
    euro(paid);

  document.getElementById("remainingAmount").textContent =
    euro(remaining);


  let unpaidCount = 0;
  let paidCount = 0;


  payments.forEach(payment => {

    payment.installments.forEach((item, index) => {

      const card =
        createInstallmentCard(
          payment,
          item,
          index
        );

      if (item.paid) {

        paidList.appendChild(card);
        paidCount++;

      } else {

        unpaidList.appendChild(card);
        unpaidCount++;

      }

    });

  });


  if (unpaidCount === 0) {

    unpaidList.innerHTML =
      '<div class="card empty">🎉 Aucun paiement à effectuer.</div>';

  }


  if (paidCount === 0) {

    paidList.innerHTML =
      '<div class="card empty">Aucun paiement effectué.</div>';

  }

}


/* =========================
   CARTE ÉCHÉANCE
========================= */

function createInstallmentCard(
  payment,
  item,
  index
) {

  const div =
    document.createElement("div");

  div.className =
    "installment" +
    (item.paid ? " paid" : "");


  const status =
    item.paid
      ? '<span class="badge paid">PAYÉ</span>'
      : '<span class="badge unpaid">À PAYER</span>';


  div.innerHTML = `

    <div class="installmentTop">

      <div>

        <strong>
          ${escapeHtml(payment.beneficiary)}
        </strong>

        <div>
          Échéance ${item.number}
          ${status}
        </div>

      </div>

      <div class="amount">
        ${euro(item.amount)}
      </div>

    </div>


    <div class="details">

      📅 Date :
      <strong>${formatDate(item.date)}</strong>

      <br>

      💬 Communication :
      <strong>
        ${escapeHtml(item.communication || "-")}
      </strong>

    </div>


    <div class="actions">

      <button
        class="small"
        onclick="togglePaid('${payment.id}', ${index})"
      >
        ${item.paid ? "↩️ Remettre à payer" : "✅ Marquer payé"}
      </button>

      <button
        class="small secondary"
        onclick="editInstallment('${payment.id}', ${index})"
      >
        ✏️ Modifier
      </button>

      <button
        class="small"
        onclick="addToGoogleCalendar('${payment.id}', ${index})"
      >
        📅 Google Agenda
      </button>

    </div>

  `;

  return div;
}


/* =========================
   MARQUER PAYÉ
========================= */

function togglePaid(paymentId, index) {

  const payment =
    payments.find(
      p => p.id === paymentId
    );

  if (!payment) return;

  if (!payment.installments[index]) return;

  payment.installments[index].paid =
    !payment.installments[index].paid;

  saveData();
}


/* =========================
   MODIFIER
========================= */

function editInstallment(
  paymentId,
  index
) {

  const payment =
    payments.find(
      p => p.id === paymentId
    );

  if (!payment) return;

  const item =
    payment.installments[index];

  if (!item) return;


  editingPaymentId =
    paymentId;

  editingInstallmentIndex =
    index;


  document.getElementById("editDate").value =
    item.date;

  document.getElementById("editAmount").value =
    item.amount;

  document.getElementById("editCommunication").value =
    item.communication || "";


  document.getElementById("editModal").style.display =
    "block";
}


function closeEdit() {

  document.getElementById("editModal").style.display =
    "none";

  editingPaymentId = null;
  editingInstallmentIndex = null;
}


function saveEdit() {

  const payment =
    payments.find(
      p => p.id === editingPaymentId
    );

  if (!payment) return;


  const item =
    payment.installments[
      editingInstallmentIndex
    ];

  if (!item) return;


  const date =
    document.getElementById("editDate").value;

  const amount =
    Number(
      document.getElementById("editAmount").value
    );

  const communication =
    document
      .getElementById("editCommunication")
      .value
      .trim();


  if (!date) {

    alert("Veuillez choisir une date.");
    return;

  }


  if (!amount || amount < 0) {

    alert("Montant incorrect.");
    return;

  }


  item.date = date;
  item.amount = amount;
  item.communication = communication;


  payment.totalAmount =
    payment.installments.reduce(
      (sum, installment) =>
        sum + Number(installment.amount || 0),
      0
    );


  saveData();

  closeEdit();
}


/* =========================
   GOOGLE CALENDAR
========================= */

function addToGoogleCalendar(
  paymentId,
  index
) {

  const payment =
    payments.find(
      p => p.id === paymentId
    );

  if (!payment) return;


  const item =
    payment.installments[index];

  if (!item) return;


  const date =
    item.date.replace(/-/g, "");


  const title =
    `Paiement - ${payment.beneficiary} - Échéance ${item.number}`;


  const details =
    `Montant : ${euro(item.amount)}\\n` +
    `Communication : ${item.communication || "-"}`;


  const url =
    "https://calendar.google.com/calendar/render" +
    "?action=TEMPLATE" +
    "&text=" + encodeURIComponent(title) +
    "&dates=" + date + "T090000/" +
    date + "T100000" +
    "&details=" + encodeURIComponent(details);


  window.open(
    url,
    "_blank"
  );
}


/* =========================
   EXPORT
========================= */

function exportData() {

  const backup = {

    app: "Mes paiements",

    version: BACKUP_VERSION,

    exportedAt:
      new Date().toISOString(),

    payments: payments

  };


  const blob =
    new Blob(
      [JSON.stringify(backup, null, 2)],
      {
        type: "application/json"
      }
    );


  const url =
    URL.createObjectURL(blob);


  const a =
    document.createElement("a");


  const date =
    new Date()
      .toISOString()
      .slice(0, 10);


  a.href = url;

  a.download =
    `mes-paiements-sauvegarde-${date}.json`;


  document.body.appendChild(a);

  a.click();

  a.remove();

  URL.revokeObjectURL(url);
}


/* =========================
   IMPORT
========================= */

function importData(event) {

  const file =
    event.target.files[0];

  if (!file) return;


  const reader =
    new FileReader();


  reader.onload = function(e) {

    try {

      const backup =
        JSON.parse(e.target.result);


      if (
        !backup ||
        backup.app !== "Mes paiements" ||
        !Array.isArray(backup.payments)
      ) {

        alert(
          "Ce fichier n'est pas une sauvegarde valide."
        );

        return;

      }


      const confirmed =
        confirm(
          "⚠️ Cette importation va remplacer les paiements actuels. Continuer ?"
        );


      if (!confirmed) {
        return;
      }


      payments =
        normalizeData(
          backup.payments
        );


      saveData();


      alert(
        "✅ Sauvegarde importée avec succès !"
      );


    } catch (error) {

      alert(
        "❌ Impossible de lire cette sauvegarde."
      );

    }

  };


  reader.readAsText(file);


  event.target.value = "";

}


/* =========================
   PROTECTION HTML
========================= */

function escapeHtml(value) {

  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

</script>

</body>
</html>
