<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Mes paiements</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f3f4f6;
    color: #111827;
}

header {
    background: #111827;
    color: white;
    padding: calc(18px + env(safe-area-inset-top)) 18px 18px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 24px;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 15px;
    padding-bottom: 50px;
}

.hidden {
    display: none !important;
}

button {
    border: 0;
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
}

.primary {
    background: #111827;
    color: white;
}

.green {
    background: #16a34a;
    color: white;
}

.blue {
    background: #2563eb;
    color: white;
}

.gray {
    background: #e5e7eb;
    color: #111827;
}

.red {
    background: #dc2626;
    color: white;
}

/* PIN */

#pinScreen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.pinBox {
    background: white;
    width: 100%;
    max-width: 360px;
    padding: 30px 22px;
    border-radius: 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,.12);
    text-align: center;
}

.pinBox h2 {
    margin-top: 0;
}

#pinInput {
    width: 100%;
    padding: 15px;
    font-size: 22px;
    text-align: center;
    letter-spacing: 8px;
    border: 1px solid #d1d5db;
    border-radius: 12px;
    margin: 15px 0;
}

.error {
    color: #dc2626;
    margin-top: 8px;
    font-size: 14px;
}

/* BARRE OUTILS */

.toolbar {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 15px;
}

.toolbar button {
    width: 100%;
}

/* STATS */

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 15px;
}

.stat {
    background: white;
    border-radius: 15px;
    padding: 13px 6px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
}

.stat small {
    display: block;
    color: #6b7280;
    font-size: 11px;
}

.stat strong {
    display: block;
    margin-top: 4px;
    font-size: 15px;
}

/* FORMULAIRE */

.formCard {
    background: white;
    padding: 18px;
    border-radius: 18px;
    margin-bottom: 18px;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
}

.formCard h2 {
    margin-top: 0;
    font-size: 19px;
}

label {
    display: block;
    margin-top: 12px;
    margin-bottom: 5px;
    font-size: 13px;
    font-weight: 600;
    color: #374151;
}

input {
    width: 100%;
    padding: 12px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    font-size: 16px;
    background: white;
}

.formButtons {
    display: flex;
    gap: 8px;
    margin-top: 16px;
}

.formButtons button {
    flex: 1;
}

/* PAIEMENTS */

.paymentCard {
    background: white;
    border-radius: 18px;
    margin-bottom: 14px;
    padding: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,.07);
}

.paymentTitle {
    font-size: 18px;
    font-weight: 700;
}

.paymentInfo {
    margin-top: 4px;
    color: #6b7280;
    font-size: 13px;
}

.installmentList {
    margin-top: 14px;
}

.installment {
    border-top: 1px solid #e5e7eb;
    padding: 12px 0;
}

.installmentTop {
    display: flex;
    align-items: center;
    gap: 9px;
}

.check {
    width: 24px;
    height: 24px;
    flex: 0 0 24px;
    cursor: pointer;
}

.installmentMain {
    flex: 1;
    min-width: 0;
}

.installmentTitle {
    font-weight: 650;
}

.installmentDetails {
    color: #6b7280;
    font-size: 13px;
    margin-top: 3px;
    word-break: break-word;
}

.installmentActions {
    display: flex;
    gap: 5px;
}

.iconButton {
    width: 40px;
    height: 40px;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 18px;
    background: #f3f4f6;
}

.paid {
    opacity: .65;
}

.paid .installmentTitle {
    text-decoration: line-through;
}

.empty {
    text-align: center;
    color: #6b7280;
    padding: 30px 10px;
}

/* MODAL */

.modalBackground {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.5);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 1000;
}

.modal {
    background: white;
    width: 100%;
    max-width: 700px;
    border-radius: 22px 22px 0 0;
    padding: 20px;
    padding-bottom: calc(20px + env(safe-area-inset-bottom));
    max-height: 90vh;
    overflow-y: auto;
}

.modal h2 {
    margin-top: 0;
}

.modalButtons {
    display: flex;
    gap: 8px;
    margin-top: 18px;
}

.modalButtons button {
    flex: 1;
}

/* MESSAGE */

.message {
    position: fixed;
    left: 15px;
    right: 15px;
    bottom: calc(15px + env(safe-area-inset-bottom));
    background: #111827;
    color: white;
    padding: 14px;
    border-radius: 14px;
    text-align: center;
    z-index: 2000;
    box-shadow: 0 5px 20px rgba(0,0,0,.25);
}
</style>
</head>

<body>

<!-- ================= PIN ================= -->

<div id="pinScreen">

    <div class="pinBox">

        <h2>🔐 Mes paiements</h2>

        <p>Entrez votre code PIN</p>

        <input
            id="pinInput"
            type="password"
            inputmode="numeric"
            maxlength="4"
            autocomplete="off"
        >

        <button class="primary" id="pinButton">
            Ouvrir
        </button>

        <div id="pinError" class="error"></div>

    </div>

</div>


<!-- ================= APPLICATION ================= -->

<div id="app" class="hidden">

<header>
    <h1>💶 Mes paiements</h1>
</header>

<div class="container">

    <!-- SAUVEGARDE -->

    <div class="toolbar">

        <button class="blue" id="exportButton">
            📤 Exporter
        </button>

        <button class="green" id="importButton">
            📥 Importer
        </button>

    </div>

    <input
        id="importFile"
        type="file"
        accept=".json,application/json"
        class="hidden"
    >


    <!-- STATISTIQUES -->

    <div class="stats">

        <div class="stat">
            <small>Total</small>
            <strong id="totalAmount">0,00 €</strong>
        </div>

        <div class="stat">
            <small>Payé</small>
            <strong id="paidAmount">0,00 €</strong>
        </div>

        <div class="stat">
            <small>Reste à payer</small>
            <strong id="remainingAmount">0,00 €</strong>
        </div>

    </div>


    <!-- AJOUT -->

    <div class="formCard">

        <h2>➕ Ajouter un paiement</h2>

        <label>Nom / bénéficiaire</label>

        <input
            id="beneficiary"
            type="text"
            placeholder="Ex. Assurance"
        >


        <label>Montant total</label>

        <input
            id="totalInput"
            type="number"
            step="0.01"
            min="0"
            placeholder="Ex. 1200"
        >


        <label>Nombre d'échéances</label>

        <input
            id="installmentsInput"
            type="number"
            min="1"
            value="1"
        >


        <label>Première date d'échéance</label>

        <input
            id="firstDateInput"
            type="date"
        >


        <label>Communication</label>

        <input
            id="communicationInput"
            type="text"
            placeholder="Ex. Assurance voiture"
        >


        <div class="formButtons">

            <button class="primary" id="addButton">
                Ajouter
            </button>

        </div>

    </div>


    <!-- LISTE -->

    <div id="paymentsList"></div>

</div>

</div>


<!-- ================= MODIFICATION ================= -->

<div id="editModalBackground" class="modalBackground hidden">

    <div class="modal">

        <h2>✏️ Modifier l'échéance</h2>

        <label>Date d'échéance</label>

        <input
            id="editDate"
            type="date"
        >


        <label>Montant</label>

        <input
            id="editAmount"
            type="number"
            step="0.01"
            min="0"
        >


        <label>Communication</label>

        <input
            id="editCommunication"
            type="text"
        >


        <div class="modalButtons">

            <button class="gray" id="cancelEdit">
                Annuler
            </button>

            <button class="primary" id="saveEdit">
                Enregistrer
            </button>

        </div>

    </div>

</div>


<script>

const PIN = "1157";

const STORAGE_KEY = "mesPaiements";

const BACKUP_VERSION = 1;

let payments = [];

let editingPaymentId = null;

let editingInstallmentIndex = null;


/* ==========================================
   OUTILS
========================================== */

function money(value) {

    return Number(value || 0).toLocaleString("fr-BE", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
    }) + " €";
}


function generateId() {

    return Date.now().toString() +
           Math.random().toString(36).substring(2, 9);
}


function escapeHtml(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


function formatDate(dateString) {

    if (!dateString) return "";

    const parts = dateString.split("-");

    if (parts.length !== 3) return dateString;

    return `${parts[2]}/${parts[1]}/${parts[0]}`;
}


function dateToUTC(dateString) {

    const parts = dateString.split("-");

    return new Date(
        Number(parts[0]),
        Number(parts[1]) - 1,
        Number(parts[2])
    );
}


/* Ajout de mois avec gestion correcte des 28/29/30/31 */

function addMonthsClamped(dateString, months) {

    const date = dateToUTC(dateString);

    const originalDay = date.getDate();

    const target = new Date(
        date.getFullYear(),
        date.getMonth() + months,
        1
    );

    const lastDay = new Date(
        target.getFullYear(),
        target.getMonth() + 1,
        0
    ).getDate();

    target.setDate(
        Math.min(originalDay, lastDay)
    );

    const y = target.getFullYear();

    const m = String(
        target.getMonth() + 1
    ).padStart(2, "0");

    const d = String(
        target.getDate()
    ).padStart(2, "0");

    return `${y}-${m}-${d}`;
}


/* ==========================================
   MESSAGE
========================================== */

function showMessage(message) {

    const old = document.querySelector(".message");

    if (old) old.remove();

    const div = document.createElement("div");

    div.className = "message";

    div.textContent = message;

    document.body.appendChild(div);

    setTimeout(() => {

        div.remove();

    }, 2500);
}


/* ==========================================
   SAUVEGARDE LOCALE
========================================== */

function saveData() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(payments)
    );
}


/* ==========================================
   NORMALISATION / ANCIENNES DONNÉES
========================================== */

function normalizeData() {

    if (!Array.isArray(payments)) {
        payments = [];
    }

    payments.forEach(payment => {

        if (!payment.id) {
            payment.id = generateId();
        }

        if (!payment.type) {
            payment.type = "multiple";
        }

        if (!payment.beneficiary) {
            payment.beneficiary = "Paiement";
        }


        /*
           Si les anciennes données ont déjà une
           liste d'échéances, on la conserve.
        */

        if (
            payment.type === "multiple" ||
            Array.isArray(payment.installmentsList)
        ) {

            if (!Array.isArray(payment.installmentsList)) {

                const count = Math.max(
                    1,
                    Number(payment.installments || 1)
                );

                const total =
                    Number(payment.totalAmount || 0);

                const totalCents =
                    Math.round(total * 100);

                const base =
                    Math.floor(totalCents / count);

                const remainder =
                    totalCents - base * count;

                payment.installmentsList = [];

                for (let i = 0; i < count; i++) {

                    let cents = base;

                    if (i === count - 1) {
                        cents += remainder;
                    }

                    payment.installmentsList.push({

                        number: i + 1,

                        amount: cents / 100,

                        date: addMonthsClamped(
                            payment.firstDate ||
                            new Date()
                                .toISOString()
                                .substring(0, 10),
                            i
                        ),

                        communication:
                            payment.communication || "",

                        paid: false
                    });
                }
            }


            payment.installmentsList.forEach(
                (item, index) => {

                    item.number = index + 1;

                    item.amount =
                        Number(item.amount || 0);

                    item.date =
                        item.date ||
                        addMonthsClamped(
                            payment.firstDate ||
                            new Date()
                                .toISOString()
                                .substring(0, 10),
                            index
                        );

                    item.communication =
                        item.communication ??
                        payment.communication ??
                        "";

                    item.paid =
                        item.paid === true;
                }
            );


            payment.totalAmount =
                payment.installmentsList.reduce(
                    (sum, item) =>
                        sum +
                        Number(item.amount || 0),
                    0
                );
        }

    });

}


/* ==========================================
   CHARGEMENT
========================================== */

function loadData() {

    try {

        const saved =
            localStorage.getItem(STORAGE_KEY);

        payments =
            saved
            ? JSON.parse(saved)
            : [];

        normalizeData();

        saveData();

    } catch (error) {

        console.error(error);

        payments = [];
    }
}


/* ==========================================
   AFFICHAGE
========================================== */

function render() {

    const list =
        document.getElementById(
            "paymentsList"
        );

    list.innerHTML = "";

    let total = 0;

    let paid = 0;


    if (payments.length === 0) {

        list.innerHTML = `
            <div class="empty">
                Aucun paiement pour le moment.<br>
                Ajoutez votre premier paiement ci-dessus.
            </div>
        `;
    }


    payments.forEach(payment => {

        if (!Array.isArray(
            payment.installmentsList
        )) {
            return;
        }


        const installments =
            payment.installmentsList;


        let paymentTotal = 0;

        let paymentPaid = 0;


        installments.forEach(item => {

            const amount =
                Number(item.amount || 0);

            paymentTotal += amount;

            if (item.paid) {
                paymentPaid += amount;
            }
        });


        total += paymentTotal;

        paid += paymentPaid;


        const card =
            document.createElement("div");

        card.className = "paymentCard";


        card.innerHTML = `

            <div class="paymentTitle">
                ${escapeHtml(payment.beneficiary)}
            </div>

            <div class="paymentInfo">
                ${installments.length}
                échéance${installments.length > 1 ? "s" : ""}
                · Total ${money(paymentTotal)}
            </div>

            <div class="installmentList"></div>
        `;


        const installmentList =
            card.querySelector(
                ".installmentList"
            );


        installments.forEach(
            (item, index) => {

                const row =
                    document.createElement("div");

                row.className =
                    "installment" +
                    (item.paid
                        ? " paid"
                        : "");


                row.innerHTML = `

                    <div class="installmentTop">

                        <input
                            class="check"
                            type="checkbox"
                            ${item.paid ? "checked" : ""}
                            data-payment-id="${payment.id}"
                            data-index="${index}"
                        >

                        <div class="installmentMain">

                            <div class="installmentTitle">
                                Échéance ${index + 1}
                                · ${money(item.amount)}
                            </div>

                            <div class="installmentDetails">
                                📅 ${formatDate(item.date)}
                                ${
                                    item.communication
                                    ? " · " +
                                      escapeHtml(
                                          item.communication
                                      )
                                    : ""
                                }
                            </div>

                        </div>

                        <div class="installmentActions">

                            <button
                                class="iconButton editButton"
                                title="Modifier"
                                data-payment-id="${payment.id}"
                                data-index="${index}"
                            >
                                ✏️
                            </button>

                            <button
                                class="iconButton calendarButton"
                                title="Google Agenda"
                                data-payment-id="${payment.id}"
                                data-index="${index}"
                            >
                                📅
                            </button>

                        </div>

                    </div>
                `;


                installmentList.appendChild(row);
            }
        );


        list.appendChild(card);
    });


    document.getElementById(
        "totalAmount"
    ).textContent = money(total);


    document.getElementById(
        "paidAmount"
    ).textContent = money(paid);


    document.getElementById(
        "remainingAmount"
    ).textContent =
        money(Math.max(0, total - paid));


    attachEvents();
}


/* ==========================================
   EVENEMENTS LISTE
========================================== */

function attachEvents() {

    document
        .querySelectorAll(".check")
        .forEach(check => {

            check.addEventListener(
                "change",
                function() {

                    const payment =
                        payments.find(
                            p =>
                            p.id ===
                            this.dataset.paymentId
                        );

                    if (!payment) return;


                    const index =
                        Number(
                            this.dataset.index
                        );


                    const item =
                        payment
                            .installmentsList[
                                index
                            ];


                    if (!item) return;


                    item.paid =
                        this.checked;


                    saveData();

                    render();
                }
            );
        });


    document
        .querySelectorAll(".editButton")
        .forEach(button => {

            button.addEventListener(
                "click",
                function() {

                    openEdit(
                        this.dataset.paymentId,
                        Number(
                            this.dataset.index
                        )
                    );
                }
            );
        });


    document
        .querySelectorAll(".calendarButton")
        .forEach(button => {

            button.addEventListener(
                "click",
                function() {

                    addToGoogleCalendar(
                        this.dataset.paymentId,
                        Number(
                            this.dataset.index
                        )
                    );
                }
            );
        });
}


/* ==========================================
   AJOUT PAIEMENT
========================================== */

document
    .getElementById("addButton")
    .addEventListener(
        "click",
        addPayment
    );


function addPayment() {

    const beneficiary =
        document
            .getElementById("beneficiary")
            .value.trim();


    const total =
        Number(
            document
                .getElementById("totalInput")
                .value
        );


    const count =
        Number(
            document
                .getElementById(
                    "installmentsInput"
                )
                .value
        );


    const firstDate =
        document
            .getElementById(
                "firstDateInput"
            )
            .value;


    const communication =
        document
            .getElementById(
                "communicationInput"
            )
            .value.trim();


    if (!beneficiary) {

        alert(
            "Veuillez indiquer le bénéficiaire."
        );

        return;
    }


    if (!total || total <= 0) {

        alert(
            "Veuillez indiquer un montant valide."
        );

        return;
    }


    if (!count || count < 1) {

        alert(
            "Veuillez indiquer le nombre d'échéances."
        );

        return;
    }


    if (!firstDate) {

        alert(
            "Veuillez choisir la première date."
        );

        return;
    }


    /*
       Division exacte en centimes.
       Exemple 1000 € / 3 :
       333,33 €
       333,33 €
       333,34 €
    */

    const totalCents =
        Math.round(total * 100);

    const baseCents =
        Math.floor(
            totalCents / count
        );

    const remainder =
        totalCents -
        (baseCents * count);


    const installmentsList = [];


    for (let i = 0; i < count; i++) {

        let cents = baseCents;

        if (i === count - 1) {
            cents += remainder;
        }


        installmentsList.push({

            number: i + 1,

            amount: cents / 100,

            date:
                addMonthsClamped(
                    firstDate,
                    i
                ),

            communication:
                communication,

            paid: false
        });
    }


    payments.push({

        id: generateId(),

        type: "multiple",

        beneficiary:

            beneficiary,

        totalAmount:

            total,

        installments:

            count,

        firstDate:

            firstDate,

        communication:

            communication,

        installmentsList:

            installmentsList
    });


    saveData();

    render();


    document
        .getElementById("beneficiary")
        .value = "";


    document
        .getElementById("totalInput")
        .value = "";


    document
        .getElementById("installmentsInput")
        .value = "1";


    document
        .getElementById("firstDateInput")
        .value = "";


    document
        .getElementById("communicationInput")
        .value = "";


    showMessage(
        "Paiement ajouté ✅"
    );
}


/* ==========================================
   MODIFICATION
========================================== */

function openEdit(
    paymentId,
    index
) {

    const payment =
        payments.find(
            p => p.id === paymentId
        );


    if (!payment) return;


    const item =
        payment.installmentsList[index];


    if (!item) return;


    editingPaymentId =
        paymentId;


    editingInstallmentIndex =
        index;


    document
        .getElementById("editDate")
        .value =
        item.date || "";


    document
        .getElementById("editAmount")
        .value =
        Number(
            item.amount || 0
        ).toFixed(2);


    document
        .getElementById(
            "editCommunication"
        )
        .value =
        item.communication || "";


    document
        .getElementById(
            "editModalBackground"
        )
        .classList
        .remove("hidden");
}


document
    .getElementById("cancelEdit")
    .addEventListener(
        "click",
        closeEdit
    );


document
    .getElementById(
        "editModalBackground"
    )
    .addEventListener(
        "click",
        function(event) {

            if (event.target === this) {
                closeEdit();
            }
        }
    );


function closeEdit() {

    document
        .getElementById(
            "editModalBackground"
        )
        .classList
        .add("hidden");


    editingPaymentId = null;

    editingInstallmentIndex = null;
}


document
    .getElementById("saveEdit")
    .addEventListener(
        "click",
        saveEdit
    );


function saveEdit() {

    if (
        editingPaymentId === null ||
        editingInstallmentIndex === null
    ) {
        return;
    }


    const payment =
        payments.find(
            p =>
            p.id ===
            editingPaymentId
        );


    if (!payment) return;


    const item =
        payment.installmentsList[
            editingInstallmentIndex
        ];


    if (!item) return;


    const date =
        document
            .getElementById(
                "editDate"
            )
            .value;


    const amount =
        Number(
            document
                .getElementById(
                    "editAmount"
                )
                .value
        );


    const communication =
        document
            .getElementById(
                "editCommunication"
            )
            .value
            .trim();


    if (!date) {

        alert(
            "Veuillez choisir une date."
        );

        return;
    }


    if (
        isNaN(amount) ||
        amount < 0
    ) {

        alert(
            "Veuillez indiquer un montant valide."
        );

        return;
    }


    /*
       IMPORTANT :
       On conserve item.paid.
       Modifier une échéance ne la
       décoche donc jamais.
    */

    item.date = date;

    item.amount =
        Math.round(
            amount * 100
        ) / 100;

    item.communication =
        communication;


    /*
       Nouveau total recalculé
       automatiquement.
    */

    payment.totalAmount =
        payment.installmentsList.reduce(
            (sum, installment) =>
                sum +
                Number(
                    installment.amount || 0
                ),
            0
        );


    saveData();

    closeEdit();

    render();

    showMessage(
        "Échéance modifiée ✅"
    );
}


/* ==========================================
   GOOGLE AGENDA
========================================== */

function addToGoogleCalendar(
    paymentId,
    index
) {

    const payment =
        payments.find(
            p => p.id === paymentId
        );


    if (!payment) return;


    const item =
        payment.installmentsList[index];


    if (!item) return;


    if (!item.date) {

        alert(
            "Cette échéance n'a pas de date."
        );

        return;
    }


    const title =
        `Paiement - ${payment.beneficiary} - Échéance ${index + 1}`;


    const date =
        item.date.replaceAll(
            "-",
            ""
        );


    /*
       Google Agenda :
       événement créé à 09h00.
       L'heure peut ensuite être changée
       directement dans Google Agenda.
    */

    const start =
        `${date}T090000`;


    const nextDate =
        getNextDay(item.date);


    const end =
        `${nextDate}T090000`;


    const details =
        `Montant : ${Number(
            item.amount
        ).toFixed(2)} €` +
        (
            item.communication
            ? `\nCommunication : ${item.communication}`
            : ""
        );


    const url =
        "https://calendar.google.com/calendar/render" +
        "?action=TEMPLATE" +
        "&text=" +
        encodeURIComponent(title) +
        "&dates=" +
        encodeURIComponent(
            `${start}/${end}`
        ) +
        "&details=" +
        encodeURIComponent(details);


    window.open(
        url,
        "_blank"
    );
}


function getNextDay(
    dateString
) {

    const date =
        dateToUTC(
            dateString
        );


    date.setDate(
        date.getDate() + 1
    );


    const y =
        date.getFullYear();


    const m =
        String(
            date.getMonth() + 1
        ).padStart(2, "0");


    const d =
        String(
            date.getDate()
        ).padStart(2, "0");


    return `${y}${m}${d}`;
}


/* ==========================================
   EXPORTATION
========================================== */

document
    .getElementById("exportButton")
    .addEventListener(
        "click",
        exportData
    );


function exportData() {

    /*
       On crée une copie complète.
       Rien n'est envoyé sur Internet.
    */

    const backup = {

        app:
            "Mes paiements",

        version:
            BACKUP_VERSION,

        exportedAt:
            new Date().toISOString(),

        payments:
            payments
    };


    const json =
        JSON.stringify(
            backup,
            null,
            2
        );


    const blob =
        new Blob(
            [json],
            {
                type:
                    "application/json"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            "a"
        );


    const date =
        new Date()
            .toISOString()
            .substring(
                0,
                10
            );


    link.href = url;

    link.download =
        `mes-paiements-sauvegarde-${date}.json`;


    document
        .body
        .appendChild(link);


    link.click();

    link.remove();


    URL.revokeObjectURL(
        url
    );


    showMessage(
        "Sauvegarde créée 📤"
    );
}


/* ==========================================
   IMPORTATION
========================================== */

document
    .getElementById("importButton")
    .addEventListener(
        "click",
        function() {

            document
                .getElementById(
                    "importFile"
                )
                .click();
        }
    );


document
    .getElementById("importFile")
    .addEventListener(
        "change",
        importData
    );


function importData(event) {

    const file =
        event.target.files[0];


    if (!file) return;


    const reader =
        new FileReader();


    reader.onload =
        function() {

            try {

                const backup =
                    JSON.parse(
                        reader.result
                    );


                /*
                   Vérification du fichier.
                */

                if (
                    !backup ||
                    backup.app !==
                    "Mes paiements" ||
                    !Array.isArray(
                        backup.payments
                    )
                ) {

                    alert(
                        "Ce fichier n'est pas une sauvegarde valide de Mes paiements."
                    );

                    return;
                }


                const confirmed =
                    confirm(
                        "⚠️ Importer cette sauvegarde va remplacer les données actuellement présentes dans l'application.\n\nVoulez-vous continuer ?"
                    );


                if (!confirmed) {
                    return;
                }


                /*
                   On charge la sauvegarde.
                */

                payments =
                    backup.payments;


                /*
                   On normalise pour assurer
                   la compatibilité avec les
                   futures versions.
                */

                normalizeData();

                saveData();

                render();


                showMessage(
                    "Sauvegarde restaurée ✅"
                );


            } catch (error) {

                console.error(error);

                alert(
                    "Impossible de lire cette sauvegarde."
                );
            }

            /*
               Permet de réimporter exactement
               le même fichier ensuite.
            */

            event.target.value = "";
        };


    reader.readAsText(
        file
    );
}


/* ==========================================
   PIN
========================================== */

document
    .getElementById("pinButton")
    .addEventListener(
        "click",
        checkPin
    );


document
    .getElementById("pinInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key ===
                "Enter"
            ) {
                checkPin();
            }
        }
    );


function checkPin() {

    const entered =
        document
            .getElementById(
                "pinInput"
            )
            .value;


    if (entered === PIN) {

        document
            .getElementById(
                "pinScreen"
            )
            .classList
            .add("hidden");


        document
            .getElementById("app")
            .classList
            .remove("hidden");


        loadData();

        render();

    } else {

        document
            .getElementById(
                "pinError"
            )
            .textContent =
            "Code PIN incorrect.";


        document
            .getElementById(
                "pinInput"
            )
            .value = "";


        document
            .getElementById(
                "pinInput"
            )
            .focus();
    }
}

document
