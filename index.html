<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f5f7">
<title>Mes paiements</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;
background:#f5f5f7;
color:#111
}

.app{
max-width:650px;
margin:auto;
padding:20px 16px 50px
}

h1{text-align:center;margin:10px 0 20px}

.card{
background:white;
border-radius:18px;
padding:18px;
margin-bottom:15px;
box-shadow:0 2px 10px rgba(0,0,0,.06)
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px
}

.stat{
text-align:center;
padding:12px 5px;
background:#f2f2f7;
border-radius:14px
}

.stat strong{
display:block;
font-size:18px;
margin-top:5px
}

.month{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:15px
}

.month button{
width:42px;
height:42px;
border:0;
border-radius:50%;
font-size:24px;
background:#e5e5ea
}

.payment{
background:white;
border-radius:17px;
padding:16px;
margin-bottom:12px;
box-shadow:0 2px 8px rgba(0,0,0,.06)
}

.payment.paid{opacity:.6}

.payment-header{
display:flex;
justify-content:space-between;
gap:10px
}

.payment h3{margin:0}

.amount{
font-weight:bold;
white-space:nowrap
}

.info{
color:#666;
font-size:14px;
margin-top:7px
}

.actions{
display:flex;
gap:8px;
margin-top:12px
}

button,input,select{font:inherit}

.primary,.secondary,.danger{
border:0;
border-radius:12px;
padding:12px;
cursor:pointer
}

.primary{
background:#007aff;
color:white;
width:100%
}

.secondary{
background:#e5e5ea;
color:#111;
flex:1
}

.danger{
background:#ff3b30;
color:white;
flex:1
}

label{
display:block;
font-size:14px;
margin-top:12px;
margin-bottom:5px
}

input,select{
width:100%;
padding:13px;
border:1px solid #ddd;
border-radius:12px;
background:white
}

#form{display:none}

.empty{
text-align:center;
color:#777;
padding:25px
}

#login{
max-width:400px;
margin:80px auto;
padding:20px
}

.pin-input{
text-align:center;
font-size:28px;
letter-spacing:10px
}

.hidden{display:none!important}

.check{
color:#34c759;
font-weight:bold
}

/* ECHEANCES */

.installments-box{
margin-top:15px;
border-top:1px solid #ddd;
padding-top:10px
}

.installment{
display:flex;
align-items:center;
gap:10px;
padding:12px 0;
border-bottom:1px solid #eee
}

.installment:last-child{
border-bottom:0
}

.installment.paid{
opacity:.55
}

.checkBox{
width:24px;
height:24px;
flex:none
}

.installment-info{
flex:1;
min-width:0
}

.installment-number{
font-weight:bold
}

.installment-date{
font-size:14px;
color:#666;
margin-top:3px
}

.installment-communication{
font-size:13px;
color:#666;
margin-top:3px;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap
}

.installment-amount{
font-weight:bold;
white-space:nowrap
}

.edit-button{
width:38px;
height:38px;
padding:0;
border:0;
border-radius:10px;
background:#e5e5ea;
font-size:18px;
flex:none
}

.installment-summary{
margin-top:12px;
padding-top:12px;
border-top:1px solid #ddd;
font-size:14px
}

.form-preview{
background:#f2f2f7;
border-radius:14px;
padding:12px;
margin-top:12px
}
</style>
</head>

<body>

<!-- PIN -->
<div id="login">

<div class="card">

<h1>Mes paiements</h1>

<p style="text-align:center">
Entrez votre code PIN
</p>

<input
id="pin"
class="pin-input"
type="password"
inputmode="numeric"
maxlength="4"
placeholder="••••">

<br><br>

<button class="primary" onclick="unlock()">
Ouvrir
</button>

<p id="pinError"
style="color:#ff3b30;text-align:center">
</p>

</div>
</div>


<!-- APPLICATION -->
<div id="app" class="app" style="display:none">

<h1>Mes paiements</h1>

<div class="card">

<div class="month">

<button onclick="changeMonth(-1)">‹</button>

<strong id="monthTitle"></strong>

<button onclick="changeMonth(1)">›</button>

</div>

<div class="stats">

<div class="stat">
Total
<strong id="total">0,00 €</strong>
</div>

<div class="stat">
Payé
<strong id="paid">0,00 €</strong>
</div>

<div class="stat">
Reste
<strong id="remaining">0,00 €</strong>
</div>

</div>
</div>


<button class="primary" onclick="openForm()">
＋ Ajouter un paiement
</button>

<br><br>

<div id="payments"></div>


<!-- FORMULAIRE -->

<div id="form" class="card">

<h2 id="formTitle">
Ajouter un paiement
</h2>

<label>Nom du paiement</label>

<input
id="name"
placeholder="Ex. Crédit voiture">


<label>Type</label>

<select id="type" onchange="updateType()">

<option value="monthly">
Paiement mensuel
</option>

<option value="multiple">
Paiement en plusieurs échéances
</option>

</select>


<div id="monthlyFields">

<label>Montant mensuel</label>

<input
id="amount"
type="number"
step="0.01"
placeholder="0.00">


<label>Jour du mois</label>

<input
id="day"
type="number"
min="1"
max="31"
placeholder="Ex. 15">

</div>


<div id="multipleFields" class="hidden">

<label>Montant total</label>

<input
id="totalAmount"
type="number"
step="0.01"
placeholder="Ex. 12000"
oninput="previewInstallments()">


<label>Nombre d'échéances</label>

<input
id="installments"
type="number"
min="1"
placeholder="Ex. 5"
oninput="previewInstallments()">


<label>Première date d'échéance</label>

<input
id="firstDate"
type="date"
onchange="previewInstallments()">


<div id="installmentPreview"></div>

</div>


<label>Bénéficiaire</label>

<input
id="beneficiary"
placeholder="Nom du bénéficiaire">


<label>Communication</label>

<input
id="communication"
placeholder="Communication par défaut">


<br>

<button class="primary" onclick="savePayment()">
Enregistrer
</button>

<br><br>

<button class="secondary" onclick="closeForm()">
Annuler
</button>

</div>

</div>


<script>

const PIN="1157";

let payments=
JSON.parse(localStorage.getItem("mesPaiements")||"[]");

let currentDate=new Date();

let editingId=null;


/* UTILITAIRES */

function euro(value){

return Number(value||0).toLocaleString(
"fr-BE",
{
style:"currency",
currency:"EUR"
}
);

}


function formatDate(date){

return new Date(date+"T12:00:00")
.toLocaleDateString(
"fr-BE",
{
day:"2-digit",
month:"2-digit",
year:"numeric"
}
);

}


function monthKeyFromDate(date){

const d=new Date(date+"T12:00:00");

return d.getFullYear()+"-"+
String(d.getMonth()+1).padStart(2,"0");

}


function currentMonthKey(){

return currentDate.getFullYear()+"-"+
String(currentDate.getMonth()+1).padStart(2,"0");

}


function monthName(){

return currentDate.toLocaleDateString(
"fr-BE",
{
month:"long",
year:"numeric"
}
);

}


function saveData(){

localStorage.setItem(
"mesPaiements",
JSON.stringify(payments)
);

}


function escapeHtml(text){

return String(text||"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


function escapeAttribute(text){

return escapeHtml(text)
.replaceAll("\n","");

}


/* PIN */

function unlock(){

const pin=
document.getElementById("pin").value;

if(pin===PIN){

document.getElementById("login")
.style.display="none";

document.getElementById("app")
.style.display="block";

render();

}else{

document.getElementById("pinError")
.textContent="Code PIN incorrect";

}

}


/* MOIS */

function changeMonth(delta){

currentDate.setMonth(
currentDate.getMonth()+delta
);

render();

}


/* FORMULAIRE */

function updateType(){

const multiple=
document.getElementById("type").value==="multiple";

document.getElementById("monthlyFields")
.classList.toggle("hidden",multiple);

document.getElementById("multipleFields")
.classList.toggle("hidden",!multiple);

if(multiple){

previewInstallments();

}

}


function openForm(id=null){

editingId=id;

document.getElementById("form")
.style.display="block";


if(id){

const p=
payments.find(x=>x.id===id);

document.getElementById("formTitle")
.textContent="Modifier le paiement";

document.getElementById("name").value=
p.name||"";

document.getElementById("type").value=
p.type||"monthly";

document.getElementById("beneficiary").value=
p.beneficiary||"";

document.getElementById("communication").value=
p.communication||"";


if(p.type==="monthly"){

document.getElementById("amount").value=
p.amount||"";

document.getElementById("day").value=
p.day||"";

}else{

document.getElementById("totalAmount").value=
p.totalAmount||"";

document.getElementById("installments").value=
p.installments||"";

document.getElementById("firstDate").value=
p.firstDate||"";

}

updateType();

}else{

document.getElementById("formTitle")
.textContent="Ajouter un paiement";

[
"name",
"amount",
"day",
"totalAmount",
"installments",
"firstDate",
"beneficiary",
"communication"
].forEach(id=>{
document.getElementById(id).value="";
});

document.getElementById("type").value="monthly";

updateType();

}

window.scrollTo({
top:document.body.scrollHeight,
behavior:"smooth"
});

}


function closeForm(){

document.getElementById("form")
.style.display="none";

editingId=null;

}


/* CREATION DES ECHEANCES */

function calculateInstallments(){

const total=
parseFloat(
document.getElementById("totalAmount").value
)||0;

const count=
parseInt(
document.getElementById("installments").value
)||0;

const firstDate=
document.getElementById("firstDate").value;

if(!total||!count||!firstDate){

return [];

}


/*
On calcule en centimes pour éviter
les erreurs d'arrondi.
*/

const totalCents=
Math.round(total*100);

const baseCents=
Math.floor(totalCents/count);

const remainder=
totalCents-(baseCents*count);

const result=[];

for(let i=0;i<count;i++){

const date=
new Date(firstDate+"T12:00:00");

date.setMonth(
date.getMonth()+i
);

const dateString=
date.getFullYear()+"-"+
String(date.getMonth()+1).padStart(2,"0")+"-"+
String(date.getDate()).padStart(2,"0");

const cents=
baseCents+
(i===count-1?remainder:0);

result.push({

number:i+1,

amount:cents/100,

date:dateString,

communication:
document.getElementById("communication").value||"",

paid:false

});

}

return result;

}


/* APERCU */

function previewInstallments(){

const preview=
document.getElementById(
"installmentPreview"
);

if(!preview)return;

const list=
calculateInstallments();

if(!list.length){

preview.innerHTML="";

return;

}

let html=
'<div class="form-preview">'+
"<strong>Échéances</strong>";

list.forEach(item=>{

html+=`

<div style="
display:flex;
justify-content:space-between;
padding:8px 0;
border-bottom:1px solid #ddd">

<span>
${item.number}/${list.length}
<br>
<small>${formatDate(item.date)}</small>
</span>

<strong>
${euro(item.amount)}
</strong>

</div>

`;

});

html+="</div>";

preview.innerHTML=html;

}


/* ENREGISTREMENT */

function savePayment(){

const name=
document.getElementById("name")
.value.trim();

const type=
document.getElementById("type").value;

const beneficiary=
document.getElementById("beneficiary")
.value.trim();

const communication=
document.getElementById("communication")
.value.trim();


if(!name){

alert("Veuillez entrer un nom.");

return;

}


/* MENSUEL */

if(type==="monthly"){

const amount=
parseFloat(
document.getElementById("amount").value
)||0;

const day=
parseInt(
document.getElementById("day").value
)||1;

if(!amount){

alert("Veuillez entrer un montant.");

return;

}

const old=
editingId
?payments.find(x=>x.id===editingId)
:null;

const data={

id:editingId||Date.now(),

name,

type:"monthly",

amount,

day,

beneficiary,

communication,

paid:old?.paid||{}

};

if(editingId){

const index=
payments.findIndex(
x=>x.id===editingId
);

payments[index]=data;

}else{

payments.push(data);

}

}


/* PLUSIEURS ECHEANCES */

else{

const total=
parseFloat(
document.getElementById("totalAmount").value
)||0;

const count=
parseInt(
document.getElementById("installments").value
)||0;

const firstDate=
document.getElementById("firstDate").value;

if(!total||!count||!firstDate){

alert(
"Veuillez remplir le montant total, le nombre d'échéances et la date."
);

return;

}

const old=
editingId
?payments.find(x=>x.id===editingId)
:null;

let list=
calculateInstallments();


/*
Lors d'une modification,
on conserve l'état payé et les
communications existantes.
*/

if(old?.installmentsList){

list.forEach((item,index)=>{

const previous=
old.installmentsList[index];

if(previous){

item.paid=
previous.paid||false;

if(previous.communication){

item.communication=
previous.communication;

}

}

});

}


const data={

id:editingId||Date.now(),

name,

type:"multiple",

totalAmount:total,

installments:count,

firstDate,

beneficiary,

communication,

installmentsList:list

};


if(editingId){

const index=
payments.findIndex(
x=>x.id===editingId
);

payments[index]=data;

}else{

payments.push(data);

}

}

saveData();

closeForm();

render();

}


/* AFFICHAGE */

function render(){

document.getElementById("monthTitle")
.textContent=monthName();

const container=
document.getElementById("payments");

container.innerHTML="";

let total=0;

let paid=0;

let found=false;

const key=
currentMonthKey();


payments.forEach(p=>{


/* PAIEMENT MENSUEL */

if(p.type==="monthly"){

total+=Number(p.amount)||0;

if(p.paid&&p.paid[key]){

paid+=Number(p.amount)||0;

}

found=true;

container.appendChild(
createMonthlyCard(p)
);

}


/* PAIEMENT A ECHEANCES */

else{

const list=
p.installmentsList||[];

const relevant=
list.filter(
item=>
monthKeyFromDate(item.date)===key
);

if(relevant.length){

found=true;

const card=
createMultipleCard(
p,
relevant
);

container.appendChild(card);

}

}

});


if(!found){

container.innerHTML=
'<div class="card empty">'+
'Aucun paiement pour ce mois.'+
'</div>';

}


document.getElementById("total")
.textContent=euro(total);

document.getElementById("paid")
.textContent=euro(paid);

document.getElementById("remaining")
.textContent=euro(total-paid);

}


/* MENSUEL */

function createMonthlyCard(p){

const div=
document.createElement("div");

const isPaid=
p.paid&&p.paid[currentMonthKey()];

div.className=
"payment"+(isPaid?" paid":"");

div.innerHTML=`

<div class="payment-header">

<div>

<h3>
${escapeHtml(p.name)}
</h3>

<div class="info">
Échéance : le ${p.day}
</div>

</div>

<div class="amount">
${euro(p.amount)}
</div>

</div>

<div class="info">

${isPaid
?'<span class="check">✓ Payé</span>'
:"Non payé"}

</div>

${p.beneficiary
?`<div class="info">
Bénéficiaire : ${escapeHtml(p.beneficiary)}
</div>`
:""}

${p.communication
?`<div class="info">
Communication : ${escapeHtml(p.communication)}
</div>`
:""}

<div class="actions">

<button
class="secondary"
onclick="toggleMonthlyPaid(${p.id})">

${isPaid
?"☑ Payé"
:"☐ Marquer payé"}

</button>

</div>

<div class="actions">

<button
class="secondary"
onclick="openForm(${p.id})">
✏️ Modifier
</button>

<button
class="danger"
onclick="deletePayment(${p.id})">
Supprimer
</button>

</div>
`;

return div;

}


/* PAIEMENT EN PLUSIEURS ECHEANCES */

function createMultipleCard(
p,
relevant
){

const div=
document.createElement("div");

div.className="payment";

let html=`

<div class="payment-header">

<div>

<h3>
${escapeHtml(p.name)}
</h3>

<div class="info">
Paiement en ${p.installments} échéances
</div>

</div>

<div class="amount">
${euro(p.totalAmount)}
</div>

</div>

<div class="installments-box">
`;


/*
Chaque échéance possède sa propre
case à cocher et son bouton modifier.
*/

relevant.forEach(item=>{

const index=
p.installmentsList.indexOf(item);

html+=`

<div class="installment
${item.paid?"paid":""}">

<input
class="checkBox"
type="checkbox"
${item.paid?"checked":""}
onchange="
toggleInstallmentPaid(
${p.id},
${index}
)">

<div class="installment-info">

<div class="installment-number">

${item.paid
?"✓ "
:""}

Échéance ${item.number}/${p.installments}

</div>

<div class="installment-date">

📅 ${formatDate(item.date)}

</div>

<div class="installment-communication">

💬 ${escapeHtml(
item.communication||"Aucune communication"
)}

</div>

</div>

<div class="installment-amount">

${euro(item.amount)}

</div>

<button
class="edit-button"
title="Modifier"
onclick="
editInstallment(
${p.id},
${index}
)">

✏️

</button>

</div>

`;

});


/* TOTAL DU PAIEMENT */

const paidCount=
(p.installmentsList||[])
.filter(x=>x.paid)
.length;

const paidAmount=
(p.installmentsList||[])
.filter(x=>x.paid)
.reduce(
(sum,x)=>sum+Number(x.amount),
0
);

html+=`

</div>

<div class="installment-summary">

<strong>
${paidCount}/${p.installments} échéances payées
</strong>

<br>

<span style="color:#666">

${euro(paidAmount)}
payés sur
${euro(p.totalAmount)}

</span>

</div>

<div class="actions">

<button
class="secondary"
onclick="openForm(${p.id})">

✏️ Modifier le paiement

</button>

<button
class="danger"
onclick="deletePayment(${p.id})">

Supprimer

</button>

</div>

`;

div.innerHTML=html;

return div;

}


/* COCHER UNE ECHEANCE */

function toggleInstallmentPaid(
id,
index
){

const p=
payments.find(x=>x.id===id);

if(!p||!p.installmentsList[index])return;

p.installmentsList[index].paid=
!p.installmentsList[index].paid;

saveData();

render();

}


/* MODIFIER UNE ECHEANCE */

function editInstallment(
id,
index
){

const p=
payments.find(x=>x.id===id);

if(!p||!p.installmentsList[index])return;

const item=
p.installmentsList[index];


/* DATE */

const newDate=
prompt(
"Date de l'échéance (AAAA-MM-JJ)",
item.date
);

if(newDate===null)return;

if(!/^\d{4}-\d{2}-\d{2}$/.test(newDate)){

alert(
"Format incorrect. Utilisez AAAA-MM-JJ."
);

return;

}


/* MONTANT */

const newAmount=
prompt(
"Montant de cette échéance (€)",
String(item.amount).replace(".",",")
);

if(newAmount===null)return;

const amount=
parseFloat(
newAmount.replace(",",".")
);

if(isNaN(amount)||amount<0){

alert("Montant incorrect.");

return;

}


/* COMMUNICATION */

const newCommunication=
prompt(
"Communication de cette échéance",
item.communication||""
);

if(newCommunication===null)return;


/* ENREGISTREMENT */

item.date=newDate;

item.amount=
Math.round(amount*100)/100;

item.communication=
newCommunication;

saveData();

render();

}


/* MENSUEL PAYE */

function toggleMonthlyPaid(id){

const p=
payments.find(x=>x.id===id);

if(!p)return;

if(!p.paid)p.paid={};

const key=
currentMonthKey();

p.paid[key]=
!p.paid[key];

saveData();

render();

}


/* SUPPRESSION */

function deletePayment(id){

if(!confirm(
"Supprimer ce paiement et toutes ses échéances ?"
))return;

payments=
payments.filter(
x=>x.id!==id
);

saveData();

render();

}


/* ENTER SUR LE PIN */

document.getElementById("pin")
.addEventListener(
"keydown",
function(e){

if(e.key==="Enter"){

unlock();

}

});

</script>

</body>
</html>
