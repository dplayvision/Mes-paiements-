<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Mes paiements</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f2f2f7;color:#111}
button,input,select{font-family:inherit}
.header{background:#007aff;color:white;padding:calc(env(safe-area-inset-top) + 15px) 18px 16px;font-size:22px;font-weight:700}
.container{padding:15px;padding-bottom:40px;max-width:700px;margin:auto}
.card{background:white;border-radius:18px;padding:16px;margin-bottom:15px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
h2{font-size:19px;margin:0 0 14px}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 6px}
input,select{width:100%;padding:13px;border:1px solid #d1d1d6;border-radius:11px;font-size:16px;background:#fff;color:#111}
input[readonly]{background:#f2f2f7;color:#555}
button{border:0;border-radius:11px;padding:11px 14px;font-size:15px;font-weight:600;cursor:pointer}
.primary{background:#007aff;color:white;width:100%}
.secondary{background:#e9e9ee;color:#111}
.danger{background:#ff3b30;color:white}
.green{background:#34c759;color:white}
.qrButton{background:#5856d6;color:white}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:15px}
.summaryBox{background:white;border-radius:15px;padding:12px 8px;text-align:center;box-shadow:0 2px 7px rgba(0,0,0,.05)}
.summaryTitle{font-size:12px;color:#666}
.summaryValue{font-size:18px;font-weight:700;margin-top:4px}
.tabs{display:flex;background:#dddde2;border-radius:11px;padding:3px;margin-bottom:15px}
.tab{flex:1;text-align:center;padding:9px;border-radius:9px;font-weight:600;font-size:14px}
.tab.active{background:white;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.selectionBar{display:none;background:#fff;border-radius:14px;padding:12px;margin-bottom:12px;align-items:center;justify-content:space-between;gap:8px}
.selectionBar.show{display:flex}
.selectionInfo{font-size:14px;font-weight:600}
.paymentCard,.domiciliationCard,.permanentCard{background:white;border-radius:18px;padding:16px;margin-bottom:15px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.paymentHeader,.domiciliationHeader,.permanentHeader{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.paymentTitle,.domiciliationTitle,.permanentTitle{font-size:19px;font-weight:750}
.paymentSummary,.domiciliationSummary,.permanentSummary{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:14px}
.paymentSummaryBox,.domiciliationSummaryBox,.permanentSummaryBox{background:#f2f2f7;border-radius:12px;padding:9px 5px;text-align:center}
.paymentSummaryTitle,.domiciliationSummaryTitle,.permanentSummaryTitle{font-size:11px;color:#777}
.paymentSummaryValue,.domiciliationSummaryValue,.permanentSummaryValue{font-size:15px;font-weight:700;margin-top:3px}
.paymentItem,.domiciliationItem,.permanentItem{border:1px solid #e1e1e6;border-radius:15px;padding:14px;margin-top:10px;background:#fff}
.paymentItem.paid,.domiciliationItem.paid{background:#f3fff5;border-color:#b7e5c0}
.paymentAlias,.domiciliationAlias,.permanentAlias{font-size:17px;font-weight:750;color:#007aff}
.paymentBeneficiary,.domiciliationBeneficiary,.permanentBeneficiary{font-size:14px;font-weight:600;margin-top:3px}
.paymentDetails,.domiciliationDetails,.permanentDetails{font-size:13px;color:#666;margin-top:8px;line-height:1.6}
.paymentAmount,.domiciliationAmount{font-size:19px;font-weight:750;margin-top:8px}
.paymentProgress,.domiciliationProgress,.permanentProgress{height:8px;background:#e5e5ea;border-radius:10px;overflow:hidden;margin-top:10px}
.paymentProgressBar,.domiciliationProgressBar,.permanentProgressBar{height:100%;background:#34c759;border-radius:10px}
.paymentNext,.domiciliationNext{background:#eaf4ff;border-radius:14px;padding:12px;margin-top:12px}
.paymentNextTop,.domiciliationNextTop{display:flex;align-items:center;gap:10px}
.paymentCheckbox,.domiciliationCheckbox{width:22px!important;height:22px!important;margin:0!important;padding:0!important;flex-shrink:0}
.paymentNextInfo,.domiciliationNextInfo{flex:1;min-width:0}
.paymentNextTitle,.domiciliationNextTitle{font-size:12px;color:#777}
.paymentNextDate,.domiciliationNextDate{font-size:15px;font-weight:700;margin-top:2px}
.paymentNextAmount,.domiciliationNextAmount{font-size:18px;font-weight:750;color:#007aff;margin-top:3px}
.paymentScheduleButton,.domiciliationScheduleButton{width:100%;margin-top:10px}
.paymentSchedule,.domiciliationSchedule{margin-top:10px}
.paymentSchedule.hidden,.domiciliationSchedule.hidden{display:none!important}
.paymentMonth,.domiciliationMonth{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid #e1e1e6;border-radius:12px;margin-top:7px;background:#fff}
.paymentMonth.paid,.domiciliationMonth.paid{background:#f3fff5;border-color:#b7e5c0}
.paymentMonth input,.domiciliationMonth input{width:21px!important;height:21px!important;margin:0!important;padding:0!important;flex-shrink:0}
.paymentMonthInfo,.domiciliationMonthInfo{flex:1;min-width:0}
.paymentMonthLabel,.domiciliationMonthLabel{font-size:12px;color:#777}
.paymentMonthDate,.domiciliationMonthDate{font-size:14px;font-weight:700;margin-top:2px}
.paymentMonthAmount,.domiciliationMonthAmount{font-size:15px;font-weight:700;margin-top:2px}
.paymentLast,.domiciliationLast{font-size:10px;font-weight:700;background:#e5e2ff;color:#5856d6;border-radius:6px;padding:3px 6px;margin-left:5px}
.paymentActions,.domiciliationActions,.permanentActions{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.paymentActions button,.domiciliationActions button,.permanentActions button{padding:8px 10px;font-size:13px}
.paymentPhotos,.domiciliationPhotos,.permanentPhotos{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.paymentPhotoBox,.domiciliationPhotoBox,.permanentPhotoBox{background:#f2f2f7;border-radius:14px;padding:8px;text-align:center;overflow:hidden}
.paymentPhoto,.domiciliationPhoto,.permanentPhoto{width:100%;height:140px;object-fit:cover;border-radius:10px;display:block;cursor:pointer}
.paymentPhotoActions,.domiciliationPhotoActions,.permanentPhotoActions{display:flex;gap:5px;margin-top:7px}
.paymentPhotoActions button,.domiciliationPhotoActions button,.permanentPhotoActions button{flex:1;padding:7px 5px;font-size:12px}
.domiciliationEmpty,.permanentEmpty{background:#f2f2f7;border-radius:12px;padding:15px;text-align:center;color:#777;font-size:14px;margin-top:10px}
.domiciliationForm,.permanentForm{margin-top:15px;padding-top:15px;border-top:1px solid #e5e5ea}
.domiciliationMonthly{background:#eaf4ff;border-radius:12px;padding:12px;margin-top:12px;font-size:14px;font-weight:600}
.domiciliationMonthly strong{font-size:20px;color:#007aff}
.domiciliationInfoBox,.permanentInfoBox{background:#f2f2f7;border-radius:12px;padding:11px;margin-top:10px;font-size:12px;color:#666;line-height:1.5}
.permanentMonthly{background:#eaf4ff;border-radius:14px;padding:13px;margin-top:12px}
.permanentMonthlyLabel{font-size:12px;color:#777}
.permanentMonthlyAmount{font-size:23px;font-weight:800;color:#007aff;margin-top:3px}
.permanentYearBox{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.permanentYearCell{background:#f2f2f7;border-radius:12px;padding:10px}
.permanentYearLabel{font-size:11px;color:#777}
.permanentYearValue{font-size:16px;font-weight:750;margin-top:3px}
.permanentNext{background:#f3f0ff;border-radius:14px;padding:12px;margin-top:12px}
.permanentNextTitle{font-size:12px;color:#777}
.permanentNextDate{font-size:15px;font-weight:700;margin-top:2px}
.permanentNextAmount{font-size:18px;font-weight:750;color:#5856d6;margin-top:3px}
.permanentPhotoEmpty,.domiciliationPhotoEmpty{height:140px;display:flex;align-items:center;justify-content:center;color:#777;font-size:13px;line-height:1.5}
.permanentPhotoButtons,.domiciliationPhotoButtons,.photoButtons{display:flex;gap:8px;margin-top:8px}
.permanentPhotoButtons button,.domiciliationPhotoButtons button,.photoButtons button{flex:1}
.permanentPhotoInput,.domiciliationPhotoInput{display:none!important}
.balloonOption{display:flex;align-items:center;gap:10px;background:#f2f2f7;border-radius:12px;padding:12px;margin-top:15px}
.balloonOption input{width:21px;height:21px;margin:0;flex-shrink:0}
.balloonOption label{margin:0;font-size:14px;font-weight:700}
.balloonBox{background:#eaf4ff;border-radius:14px;padding:13px;margin-top:10px}
.balloonTitle{font-size:14px;font-weight:750;color:#007aff;margin-bottom:8px}
.balloonInfo{font-size:12px;color:#666;line-height:1.5;margin-top:10px}
.balloonTotal{background:white;border-radius:10px;padding:10px;margin-top:10px;font-size:14px}
.balloonTotal strong{color:#007aff;font-size:17px}
.photoPreview{max-width:100%;max-height:180px;display:block;margin-top:10px;border-radius:10px}
.small{font-size:12px;color:#777}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:4px 7px;border-radius:7px;margin-left:5px}
.badgePaid{background:#d8f8df;color:#167c2e}
.badgeUnpaid{background:#ffe0dd;color:#c62820}
.badgeBalloon{background:#e5e2ff;color:#5856d6}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:18px;z-index:1000}
.modal.show{display:flex}
.modalBox{background:white;width:100%;max-width:500px;max-height:90vh;overflow:auto;border-radius:20px;padding:18px}
.modalTitle{font-size:20px;font-weight:750;margin-bottom:12px}
.modalActions{display:flex;gap:8px;margin-top:15px}
.modalActions button{flex:1}
.manualInfo{background:#f2f2f7;border-radius:12px;padding:12px;margin-bottom:10px}
.manualLine{margin-bottom:12px}
.manualLabel{font-size:12px;color:#777}
.manualValue{font-size:15px;font-weight:600;word-break:break-word;margin-top:2px}
.copyButton{margin-top:5px;background:#e9e9ee;font-size:12px;padding:7px 10px}
.copyButton.copied{background:#34c759;color:white}
.login{position:fixed;inset:0;background:#f2f2f7;display:flex;align-items:center;justify-content:center;padding:25px;z-index:2000}
.loginBox{background:white;width:100%;max-width:360px;border-radius:22px;padding:25px;box-shadow:0 5px 25px rgba(0,0,0,.12);text-align:center}
.loginTitle{font-size:25px;font-weight:800;margin-bottom:8px}
.loginText{font-size:14px;color:#777;margin-bottom:18px}
#pinInput{text-align:center;font-size:25px;letter-spacing:8px}
.loginFaceButton{margin-top:12px;width:100%;background:#111;color:white}
.loginMessage{font-size:12px;color:#777;line-height:1.5;margin-top:12px}
.hidden{display:none!important}
input[type="file"]{display:none}
.photoModalImage{max-width:100%;max-height:75vh;display:block;margin:auto;border-radius:12px}
.photoModalButtons{display:flex;gap:8px;margin-top:12px}
.photoModalButtons button{flex:1}
.qrContainer{text-align:center;padding:10px 0}
#qrCode{display:flex;justify-content:center;align-items:center;padding:10px;background:white}
#qrCode img,#qrCode canvas{margin:auto}
.qrInfo{background:#f2f2f7;border-radius:12px;padding:12px;margin-top:12px;font-size:13px;line-height:1.5;text-align:left}
.qrWarning{font-size:12px;color:#777;margin-top:10px;text-align:center}
.calculatorDisplay{font-size:25px;font-weight:700;text-align:right;background:#f2f2f7;margin-bottom:10px}
.calculatorGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.calculatorGrid button{font-size:18px;padding:14px 5px}
.calculatorEquals{margin-top:8px;width:100%;font-size:18px}
.empty{background:white;border-radius:15px;padding:20px;text-align:center;color:#777;margin-bottom:15px}
</style>
</head>
<body>

<div id="loginScreen" class="login">
 <div class="loginBox">
  <div class="loginTitle">Mes paiements</div>
  <div class="loginText">Connecte-toi avec Face ID ou ton code PIN</div>
  <button id="faceIDLoginButton" class="loginFaceButton" type="button" onclick="faceIDLogin()"> Face ID / clé d’accès</button>
  <div style="margin:18px 0 10px;color:#888;font-size:13px">Ou utilise ton code PIN</div>
  <input id="pinInput" type="password" inputmode="numeric" maxlength="4" placeholder="••••">
  <br><br>
  <button class="primary" onclick="checkPin()">Ouvrir avec le PIN</button>
  <button id="activateFaceIDButton" class="secondary" type="button" style="width:100%;margin-top:10px" onclick="activateFaceID()">Activer Face ID sur cet appareil</button>
  <div id="loginMessage" class="loginMessage">La première fois, ouvre avec ton PIN puis active Face ID sur cet appareil.</div>
 </div>
</div>

<div id="app" class="hidden">
<div class="header">Mes paiements</div>
<div class="container">

<div class="summary">
<div class="summaryBox"><div class="summaryTitle">Total</div><div id="totalValue" class="summaryValue">0,00 €</div></div>
<div class="summaryBox"><div class="summaryTitle">Payé</div><div id="paidValue" class="summaryValue">0,00 €</div></div>
<div class="summaryBox"><div class="summaryTitle">Reste</div><div id="remainingValue" class="summaryValue">0,00 €</div></div>
</div>

<div class="tabs">
<div id="tabUnpaid" class="tab active" onclick="showTab('unpaid')">À payer (<span id="unpaidCount">0</span>)</div>
<div id="tabPaid" class="tab" onclick="showTab('paid')">Payé (<span id="paidCount">0</span>)</div>
</div>

<div id="selectionBar" class="selectionBar">
<div id="selectionInfo" class="selectionInfo">0 sélectionné</div>
<button class="danger" onclick="deleteSelected()">Supprimer</button>
</div>

<div id="unpaidList"></div>
<div id="paidList" class="hidden"></div>

<div class="card">
<h2>Ajouter un paiement</h2>
<label>Alias / raccourci</label><input id="alias" placeholder="Ex : Taxe maison">
<label>Bénéficiaire</label><input id="beneficiary" placeholder="Nom du bénéficiaire">
<label>IBAN</label><input id="iban" placeholder="BE...">
<label>Montant total</label><input id="totalAmount" type="number" step="0.01" inputmode="decimal" placeholder="0,00">
<label>Nombre d'échéances</label><input id="installments" type="number" min="1" value="1">
<label>Première échéance</label><input id="firstDate" type="date">
<label>Communication</label><input id="communication" placeholder="Communication">
<label>Document</label>
<div class="photoButtons">
<button class="secondary" onclick="document.getElementById('cameraInput').click()">📷 Appareil photo</button>
<button class="secondary" onclick="document.getElementById('galleryInput').click()">🖼️ Mes photos</button>
</div>
<input id="cameraInput" type="file" accept="image/*" capture="environment">
<input id="galleryInput" type="file" accept="image/*">
<div id="addPhotoPreview"></div>
<br>
<button class="primary" onclick="addPayment()">Ajouter le paiement</button>
</div>

     Domiciliations permanentes, Calculette, Sauvegarde et les modales
   modales
