<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Mes paiements</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
background:#f2f2f7;
color:#111;
}

button,input,select{
font:inherit;
}

button{
border:0;
border-radius:12px;
padding:12px 15px;
background:#007aff;
color:white;
font-weight:600;
cursor:pointer;
}

button:active{
opacity:.75;
}

button.secondary{
background:#e5e5ea;
color:#111;
}

button.danger{
background:#ff3b30;
color:white;
}

button.green{
background:#34c759;
color:white;
}

button.orange{
background:#ff9500;
color:white;
}

.hidden{
display:none!important;
}

/* PIN */

#loginScreen{
position:fixed;
inset:0;
background:#f2f2f7;
display:flex;
align-items:center;
justify-content:center;
z-index:9999;
padding:20px;
}

.loginBox{
width:100%;
max-width:380px;
background:white;
border-radius:24px;
padding:30px 22px;
box-shadow:0 10px 40px rgba(0,0,0,.12);
text-align:center;
}

.loginBox h1{
margin:0 0 8px;
font-size:28px;
}

.loginBox p{
color:#777;
margin:0 0 22px;
}

.pinDots{
display:flex;
justify-content:center;
gap:12px;
margin:20px 0;
}

.pinDot{
width:14px;
height:14px;
border-radius:50%;
background:#d1d1d6;
}

.pinDot.active{
background:#007aff;
}

.pinPad{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
}

.pinPad button{
height:58px;
font-size:21px;
background:#fff;
color:#111;
border:1px solid #ddd;
}

.pinPad button:last-child{
background:#e5e5ea;
}

/* HEADER */

header{
position:sticky;
top:0;
z-index:100;
background:#007aff;
color:white;
padding:14px 15px;
padding-top:calc(14px + env(safe-area-inset-top));
box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.headerTop{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
}

header h1{
font-size:21px;
margin:0;
}

.headerActions{
display:flex;
gap:6px;
}

.headerActions button{
padding:8px 10px;
font-size:13px;
background:rgba(255,255,255,.18);
}

.tabs{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:7px;
margin-top:12px;
}

.tabButton{
background:rgba(255,255,255,.18);
font-size:13px;
padding:9px 5px;
}

.tabButton.active{
background:white;
color:#007aff;
}

/* CONTENT */

main{
max-width:800px;
margin:auto;
padding:15px;
padding-bottom:100px;
}

.section{
display:none;
}

.section.active{
display:block;
}

.card{
background:white;
border-radius:18px;
padding:15px;
margin-bottom:13px;
box-shadow:0 1px 4px rgba(0,0,0,.08);
}

.card h2{
margin:0 0 12px;
font-size:19px;
}

.card h3{
margin:0 0 8px;
font-size:17px;
}

.formGroup{
margin-bottom:12px;
}

label{
display:block;
font-size:13px;
font-weight:600;
color:#555;
margin-bottom:5px;
}

input,
select{
width:100%;
border:1px solid #d1d1d6;
border-radius:11px;
padding:12px;
background:white;
outline:none;
}

input:focus,
select:focus{
border-color:#007aff;
}

.row{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.row3{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:8px;
}

.actions{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-top:12px;
}

.actions button{
flex:1;
min-width:110px;
}

.small{
font-size:12px;
color:#777;
}

.amount{
font-size:24px;
font-weight:700;
}

.summaryGrid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
}

.summaryBox{
background:#f2f2f7;
border-radius:14px;
padding:12px 8px;
text-align:center;
}

.summaryBox strong{
display:block;
font-size:18px;
margin-bottom:3px;
}

.summaryBox span{
font-size:11px;
color:#777;
}

.progress{
height:9px;
background:#e5e5ea;
border-radius:10px;
overflow:hidden;
margin:10px 0;
}

.progressBar{
height:100%;
background:#34c759;
border-radius:10px;
}

/* PAYMENT CARDS */

.itemHeader{
display:flex;
justify-content:space-between;
gap:10px;
align-items:flex-start;
}

.itemTitle{
font-size:18px;
font-weight:700;
}

.badge{
display:inline-block;
padding:5px 8px;
border-radius:9px;
font-size:11px;
font-weight:700;
background:#e5e5ea;
}

.badge.green{
background:#d1f7dc;
color:#15803d;
}

.badge.orange{
background:#fff0d2;
color:#a85d00;
}

.infoGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:7px;
margin-top:12px;
}

.infoCell{
background:#f7f7f9;
border-radius:10px;
padding:9px;
}

.infoCell span{
display:block;
font-size:11px;
color:#777;
margin-bottom:2px;
}

.infoCell strong{
font-size:14px;
word-break:break-word;
}

.installmentList{
margin-top:12px;
}

.installment{
display:flex;
align-items:center;
gap:9px;
padding:9px 0;
border-top:1px solid #eee;
}

.installment input{
width:22px;
height:22px;
margin:0;
}

.installmentMain{
flex:1;
}

.installmentMain strong{
display:block;
font-size:14px;
}

.installmentMain span{
font-size:12px;
color:#777;
}

.installmentPaid{
text-decoration:line-through;
opacity:.55;
}

.nextPayment{
background:#eaf3ff;
border-radius:12px;
padding:10px;
margin-top:10px;
color:#005ecb;
}

/* PHOTOS */

.photoButtons{
display:flex;
gap:8px;
margin-top:8px;
}

.photoButtons button{
flex:1;
}

.photoInput{
display:none!important;
}

.photoPreviewGrid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
margin-top:10px;
}

.photoPreviewBox{
background:#f2f2f7;
border-radius:14px;
padding:8px;
overflow:hidden;
}

.photoPreviewBox img{
width:100%;
height:140px;
object-fit:cover;
border-radius:10px;
display:block;
}

.photoPreviewActions{
display:flex;
gap:6px;
margin-top:6px;
}

.photoPreviewActions button{
flex:1;
font-size:12px;
padding:8px 5px;
}

/* DOMICILIATIONS */

.domiciliationCard{
background:white;
border-radius:18px;
padding:15px;
margin-bottom:13px;
box-shadow:0 1px 4px rgba(0,0,0,.08);
}

.domHeader{
display:flex;
justify-content:space-between;
gap:10px;
align-items:flex-start;
}

.domTitle{
font-size:19px;
font-weight:700;
}

.domSub{
font-size:13px;
color:#777;
margin-top:3px;
}

.domAmount{
font-size:23px;
font-weight:700;
text-align:right;
white-space:nowrap;
}

.domInfoGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
margin-top:12px;
}

.domInfo{
background:#f7f7f9;
border-radius:11px;
padding:10px;
}

.domInfo span{
display:block;
font-size:11px;
color:#777;
margin-bottom:3px;
}

.domInfo strong{
font-size:14px;
word-break:break-word;
}

.domPhotos{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
margin-top:12px;
}

.domPhotoBox{
background:#f2f2f7;
border-radius:14px;
padding:8px;
text-align:center;
overflow:hidden;
}

.domPhoto{
width:100%;
height:140px;
object-fit:cover;
border-radius:10px;
display:block;
cursor:pointer;
}

.domPhotoEmpty{
height:140px;
display:flex;
align-items:center;
justify-content:center;
color:#777;
font-size:13px;
line-height:1.5;
}

.domPhotoActions{
display:flex;
gap:5px;
margin-top:7px;
flex-wrap:wrap;
}

.domPhotoActions button{
flex:1;
min-width:80px;
padding:8px 5px;
font-size:11px;
}

.domiciliationPhotoButtons{
display:flex;
gap:8px;
margin-top:8px;
}

.domiciliationPhotoButtons button{
flex:1;
}

.domiciliationPhotoInput{
display:none!important;
}

/* MODAL */

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.5);
z-index:500;
display:none;
align-items:flex-end;
justify-content:center;
}

.modal.show{
display:flex;
}

.modalContent{
width:100%;
max-width:800px;
max-height:92vh;
overflow:auto;
background:#f2f2f7;
border-radius:22px 22px 0 0;
padding:18px;
padding-bottom:calc(25px + env(safe-area-inset-bottom));
}

.modalHeader{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:15px;
}

.modalHeader h2{
margin:0;
font-size:20px;
}

.closeBtn{
background:#e5e5ea;
color:#111;
width:38px;
height:38px;
padding:0;
border-radius:50%;
font-size:20px;
}

.photoModal{
position:fixed;
inset:0;
background:rgba(0,0,0,.92);
z-index:1000;
display:none;
align-items:center;
justify-content:center;
padding:15px;
}

.photoModal.show{
display:flex;
}

.photoModal img{
max-width:100%;
max-height:90vh;
object-fit:contain;
}

.photoModalClose{
position:absolute;
top:20px;
right:20px;
background:rgba(255,255,255,.2);
font-size:24px;
width:45px;
height:45px;
padding:0;
}

/* FILTER */

.filterButtons{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
margin-bottom:12px;
}

.filterButtons button.active{
background:#007aff;
color:white;
}

.searchBox{
margin-bottom:12px;
}

/* QR */

#qrContainer{
background:white;
padding:20px;
border-radius:15px;
display:flex;
justify-content:center;
margin-top:12px;
}

/* CALCULATOR */

.calcDisplay{
background:#111;
color:white;
border-radius:14px;
padding:15px;
font-size:28px;
text-align:right;
min-height:60px;
overflow:hidden;
}

.calcGrid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:7px;
margin-top:8px;
}

.calcGrid button{
background:#e5e5ea;
color:#111;
height:55px;
font-size:18px;
}

.calcGrid button.operator{
background:#007aff;
color:white;
}

.calcGrid button.equal{
background:#34c759;
color:white;
}

/* EMPTY */

.empty{
text-align:center;
color:#777;
padding:30px 15px;
}

hr{
border:0;
border-top:1px solid #eee;
margin:15px 0;
}

@media(max-width:480px){

main{
padding:10px;
}

.row3{
grid-template-columns:1fr 1fr;
}

.summaryGrid{
grid-template-columns:1fr 1fr 1fr;
}

.domHeader{
flex-direction:column;
}

.domAmount{
text-align:left;
}

.infoGrid,
.domInfoGrid{
grid-template-columns:1fr 1fr;
}

.actions button{
min-width:90px;
}

}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginScreen">

<div class="loginBox">

<h1>Mes paiements</h1>
<p>Entrez votre code PIN</p>

<div class="pinDots">
<div class="pinDot" id="dot0"></div>
<div class="pinDot" id="dot1"></div>
<div class="pinDot" id="dot2"></div>
<div class="pinDot" id="dot3"></div>
</div>

<div id="pinError"
style="color:#ff3b30;font-size:13px;min-height:20px;">
</div>

<div class="pinPad">

<button onclick="pinNumber('1')">1</button>
<button onclick="pinNumber('2')">2</button>
<button onclick="pinNumber('3')">3</button>

<button onclick="pinNumber('4')">4</button>
<button onclick="pinNumber('5')">5</button>
<button onclick="pinNumber('6')">6</button>

<button onclick="pinNumber('7')">7</button>
<button onclick="pinNumber('8')">8</button>
<button onclick="pinNumber('9')">9</button>

<button onclick="clearPin()">⌫</button>
<button onclick="pinNumber('0')">0</button>
<button onclick="clearPin()">C</button>

</div>

</div>
</div>

<!-- APP -->

<div id="app" class="hidden">

<header>

<div class="headerTop">

<h1>Mes paiements</h1>

<div class="headerActions">
<button onclick="exportData()">💾</button>
<button onclick="document.getElementById('importFile').click()">📂</button>
<button onclick="lockApp()">🔒</button>
</div>

</div>

<div class="tabs">

<button id="tabPayments"
class="tabButton active"
onclick="showSection('payments')">
💳 Paiements
</button>

<button id="tabDoms"
class="tabButton"
onclick="showSection('domiciliations')">
🏦 Domiciliations
</button>

<button id="tabCalc"
class="tabButton"
onclick="showSection('calculator')">
🧮 Calculatrice
</button>

</div>

</header>

<input
type="file"
id="importFile"
class="hidden"
accept=".json,application/json"
onchange="importData(event)">

<main>

<!-- ================= PAYMENTS ================= -->

<section id="paymentsSection" class="section active">

<div class="card">

<h2>Ajouter un paiement</h2>

<div class="formGroup">
<label>Nom / Désignation</label>
<input id="pAlias" placeholder="Ex : Taxe maison">
</div>

<div class="formGroup">
<label>Bénéficiaire</label>
<input id="pBeneficiary" placeholder="Nom du bénéficiaire">
</div>

<div class="formGroup">
<label>IBAN</label>
<input id="pIban" placeholder="BE...">
</div>

<div class="row">

<div class="formGroup">
<label>Montant total (€)</label>
<input id="pTotal" type="number" step="0.01">
</div>

<div class="formGroup">
<label>Nombre d'échéances</label>
<input id="pInstallments" type="number" min="1" value="1">
</div>

</div>

<div class="formGroup">
<label>Date de la première échéance</label>
<input id="pStartDate" type="date">
</div>

<div class="formGroup">
<label>Communication</label>
<input id="pCommunication">
</div>

<label>Photo du document</label>

<div class="photoButtons">

<button
type="button"
class="secondary"
onclick="document.getElementById('paymentCamera').click()">
📷 Caméra
</button>

<button
type="button"
class="secondary"
onclick="document.getElementById('paymentGallery').click()">
🖼️ Photos
</button>

</div>

<input
id="paymentCamera"
class="photoInput"
type="file"
accept="image/*"
capture="environment"
onchange="handlePaymentPhoto(event)">

<input
id="paymentGallery"
class="photoInput"
type="file"
accept="image/*"
onchange="handlePaymentPhoto(event)">

<div id="paymentPhotoPreview"></div>

<div class="actions">

<button onclick="addPayment()">
➕ Ajouter
</button>

<button class="secondary" onclick="clearPaymentForm()">
Effacer
</button>

</div>

</div>

<div class="card">

<div class="summaryGrid">

<div class="summaryBox">
<strong id="totalPaymentsCount">0</strong>
<span>Paiements</span>
</div>

<div class="summaryBox">
<strong id="totalPaymentsAmount">0,00 €</strong>
<span>Total</span>
</div>

<div class="summaryBox">
<strong id="remainingPaymentsAmount">0,00 €</strong>
<span>Restant</span>
</div>

</div>

</div>

<div class="filterButtons">

<button
id="filterUnpaid"
class="active"
onclick="setPaymentFilter('unpaid')">
À payer
</button>

<button
id="filterPaid"
class="secondary"
onclick="setPaymentFilter('paid')">
Payé
</button>

</div>

<div class="searchBox">
<input
id="paymentSearch"
placeholder="🔎 Rechercher..."
oninput="renderPayments()">
</div>

<div id="paymentsList"></div>

</section>

<!-- ================= DOMICILIATIONS ================= -->

<section id="domiciliationsSection" class="section">

<div class="card">

<h2>Ajouter une domiciliation</h2>

<div class="formGroup">
<label>Nom / Désignation</label>
<input id="dAlias" placeholder="Ex : Crédit auto">
</div>

<div class="formGroup">
<label>Bénéficiaire</label>
<input id="dBeneficiary" placeholder="Banque / organisme">
</div>

<div class="formGroup">
<label>IBAN</label>
<input id="dIban" placeholder="BE...">
</div>

<div class="row">

<div class="formGroup">
<label>Montant total (€)</label>
<input id="dTotal" type="number" step="0.01">
</div>

<div class="formGroup">
<label>Nombre de mois</label>
<input id="dMonths" type="number" min="1">
</div>

</div>

<div class="row">

<div class="formGroup">
<label>TAEG (%)</label>
<input id="dTaeg" type="number" step="0.01">
</div>

<div class="formGroup">
<label>Mensualité fixe (€)</label>
<input id="dMonthly" type="number" step="0.01"
placeholder="Optionnel">
</div>

</div>

<div class="formGroup">
<label>Date de début</label>
<input id="dStartDate" type="date">
</div>

<div class="formGroup">
<label>Date de fin</label>
<input id="dEndDate" type="date">
</div>

<div class="formGroup">
<label>Dernière échéance différente (€)</label>
<input id="dFinalPayment" type="number" step="0.01"
placeholder="Optionnel">
</div>

<label>Photos de la domiciliation</label>

<div class="domiciliationPhotoButtons">

<button
type="button"
class="secondary"
onclick="document.getElementById('domPhoto1Camera').click()">
📷 Photo 1
</button>

<button
type="button"
class="secondary"
onclick="document.getElementById('domPhoto2Camera').click()">
📷 Photo 2
</button>

</div>

<input
id="domPhoto1Camera"
class="domiciliationPhotoInput"
type="file"
accept="image/*"
capture="environment"
onchange="handleDomiciliationAddPhoto(event,0)">

<input
id="domPhoto2Camera"
class="domiciliationPhotoInput"
type="file"
accept="image/*"
capture="environment"
onchange="handleDomiciliationAddPhoto(event,1)">

<div class="domiciliationPhotoButtons">

<button
type="button"
class="secondary"
onclick="document.getElementById('domPhoto1Gallery').click()">
🖼️ Photo 1
</button>

<button
type="button"
class="secondary"
onclick="document.getElementById('domPhoto2Gallery').click()">
🖼️ Photo 2
</button>

</div>

<input
id="domPhoto1Gallery"
class="domiciliationPhotoInput"
type="file"
accept="image/*"
onchange="handleDomiciliationAddPhoto(event,0)">

<input
id="domPhoto2Gallery"
class="domiciliationPhotoInput"
type="file"
accept="image/*"
onchange="handleDomiciliationAddPhoto(event,1)">

<div id="domAddPhotosPreview" class="domPhotos"></div>

<div class="actions">

<button onclick="addDomiciliation()">
➕ Ajouter
</button>

<button class="secondary" onclick="clearDomiciliationForm()">
Effacer
</button>

</div>

</div>

<div id="domiciliationsList"></div>

</section>

<!-- ================= CALCULATOR ================= -->

<section id="calculatorSection" class="section">

<div class="card">

<h2>Calculatrice</h2>

<div id="calcDisplay" class="calcDisplay">0</div>

<div class="calcGrid">

<button onclick="calcInput('7')">7</button>
<button onclick="calcInput('8')">8</button>
<button onclick="calcInput('9')">9</button>
<button class="operator" onclick="calcInput('/')">÷</button>

<button onclick="calcInput('4')">4</button>
<button onclick="calcInput('5')">5</button>
<button onclick="calcInput('6')">6</button>
<button class="operator" onclick="calcInput('*')">×</button>

<button onclick="calcInput('1')">1</button>
<button onclick="calcInput('2')">2</button>
<button onclick="calcInput('3')">3</button>
<button class="operator" onclick="calcInput('-')">−</button>

<button onclick="calcInput('0')">0</button>
<button onclick="calcInput('.')">.</button>
<button onclick="calcClear()">C</button>
<button class="operator" onclick="calcInput('+')">+</button>

<button class="equal"
style="grid-column:span 4"
onclick="calcResult()">
=
</button>

</div>

</div>

</section>

</main>
</div>

<!-- ================= EDIT PAYMENT MODAL ================= -->

<div id="paymentModal" class="modal">

<div class="modalContent">

<div class="modalHeader">

<h2>Modifier le paiement</h2>

<button
class="closeBtn"
onclick="closeModal('paymentModal')">
×
</button>

</div>

<div id="paymentEditContent"></div>

</div>

</div>

<!-- ================= EDIT DOMICILIATION MODAL ================= -->

<div id="domModal" class="modal">

<div class="modalContent">

<div class="modalHeader">

<h2>Modifier la domiciliation</h2>

<button
class="closeBtn"
onclick="closeModal('domModal')">
×
</button>

</div>

<div id="domEditContent"></div>

</div>

</div>

<!-- ================= PHOTO MODAL ================= -->

<div
id="photoModal"
class="photoModal"
onclick="closePhotoModal()">

<button
class="photoModalClose"
onclick="closePhotoModal()">
×
</button>

<img id="photoModalImage" src="" onclick="event.stopPropagation()">

</div>

<script>

/* =========================================================
   VARIABLES
========================================================= */

const PIN="1157";

========================================================= */

function euro(value){
value=Number(value)||0;
return value.toLocaleString("fr-BE",{
minimumFractionDigits:2,
maximumFractionDigits:2
})+" €";
}

function moneyNumber(value){
return Number(
String(value||0)
.replace(",",".")
.replace(/[^\d.-]/g,"")
)||0;
}

function formatDate(date){
if(!date)return "-";

const d=new Date(date+"T00:00:00");

if(isNaN(d.getTime()))return date;

return d.toLocaleDateString("fr-BE");
}

"mesPaiements",
JSON.stringify(payments)

function generateId(){
return Date.now().toString(36)+
Math.random().toString(36).substring(2,9);
}

function escapeHtml(value){
return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

function compressImage(file,callback){

if(!file)return;

const reader=new FileReader();

reader.onload=function(e){

const img=new Image();

img.onload=function(){

const maxWidth=1400;

let width=img.width;
let height=img.height;

if(width>maxWidth){

height=Math.round(
height*maxWidth/width
);

width=maxWidth;

}

const canvas=document.createElement("canvas");

canvas.width=width;
canvas.height=height;

const ctx=canvas.getContext("2d");

ctx.drawImage(
img,
0,
0,
width,
height
);

callback(
canvas.toDataURL("image/jpeg",.75)
);

};

img.src=e.target.result;

};

reader.readAsDataURL(file);

}

function buildPaymentInstallments(
total,
count,
startDate
){

total=Number(total)||0;
count=Math.max(1,Number(count)||1);

let base=Math.floor(
(total/count)*100
)/100;

let remainder=Math.round(
(total-base*count)*100
)/100;

const result=[];

for(let i=0;i<count;i++){

let amount=base;

if(i===count-1){
amount+=remainder;
}

let d=new Date(
startDate+"T00:00:00"
);

d.setMonth(
d.getMonth()+i
);

result.push({
id:generateId(),
date:d.toISOString().slice(0,10),
amount:Math.round(amount*100)/100,
paid:false
});

}

return result;

}

function calculateDomiciliationSchedule(dom){

const total=Number(dom.total)||0;

const months=Math.max(
1,
Number(dom.months)||1
);

let monthly=Number(dom.monthly)||0;

if(monthly<=0){

monthly=Math.round(
(total/months)*100
)/100;

}

const finalPayment=
Number(dom.finalPayment)||0;

const result=[];

let remaining=total;

for(let i=0;i<months;i++){

let amount=monthly;

if(i===months-1){

if(finalPayment>0){

amount=finalPayment;

}else{

amount=Math.round(
remaining*100
)/100;

}

}

if(amount>remaining){

amount=remaining;

}

if(amount<0)amount=0;

let date;

if(dom.startDate){

date=new Date(
dom.startDate+"T00:00:00"
);

date.setMonth(
date.getMonth()+i
);

}else{

date=new Date();

date.setMonth(
date.getMonth()+i
);

}

result.push({

id:generateId(),

date:date.toISOString().slice(0,10),

amount:Math.round(amount*100)/100,

paid:false

});

remaining=Math.round(
(remaining-amount)*100
)/100;

}

return result;

}

function toggleDomiciliationInstallment(
domId,
installmentId
){

const dom=domiciliations.find(
d=>d.id===domId
);

if(!dom)return;

const item=dom.schedule.find(
i=>i.id===installmentId
);

if(!item)return;

item.paid=!item.paid;

saveDomiciliations();

renderDomiciliations();

}

function payNextDomiciliation(id){

const dom=domiciliations.find(
d=>d.id===id
);

if(!dom)return;

const next=dom.schedule.find(
i=>!i.paid
);

if(next){

next.paid=true;

}else{

dom.schedule.forEach(
i=>i.paid=true
);

}

saveDomiciliations();

renderDomiciliations();

}

function deleteDomiciliation(id){

if(!confirm(
"Supprimer définitivement cette domiciliation ?"
))return;

domiciliations=
domiciliations.filter(
d=>d.id!==id
);

saveDomiciliations();

renderDomiciliations();

}

function saveDomiciliationEdit(id){

const dom=domiciliations.find(
d=>d.id===id
);

if(!dom)return;

dom.alias=document.getElementById(
"editDAlias"
).value.trim();

dom.beneficiary=document.getElementById(
"editDBeneficiary"
).value.trim();

dom.iban=document.getElementById(
"editDIban"
).value.trim();

dom.total=moneyNumber(
document.getElementById("editDTotal").value
);

dom.months=parseInt(
document.getElementById("editDMonths").value
)||1;

dom.taeg=moneyNumber(
document.getElementById("editDTaeg").value
);

dom.monthly=moneyNumber(
document.getElementById("editDMonthly").value
);

dom.startDate=document.getElementById(
"editDStartDate"
).value;

dom.endDate=document.getElementById(
"editDEndDate"
).value;

dom.finalPayment=moneyNumber(
document.getElementById("editDFinalPayment").value
);

/*
 On conserve les échéances déjà payées.
*/

const oldPaid={};

(dom.schedule||[]).forEach(item=>{
oldPaid[item.date]=item.paid;
});

const newSchedule=
calculateDomiciliationSchedule(dom);

newSchedule.forEach(item=>{
if(oldPaid[item.date]===true){
item.paid=true;
}
});

dom.schedule=newSchedule;

saveDomiciliations();

closeModal("domModal");

renderDomiciliations();

}

/* =========================================================
   EXPORT / IMPORT
========================================================= */

function exportData(){

const data={

version:1,

payments,

domiciliations,

exportedAt:new Date().toISOString()

};

const blob=new Blob(
[
JSON.stringify(data,null,2)
],
{
type:"application/json"
}
);

const url=URL.createObjectURL(blob);

const a=document.createElement("a");

a.href=url;

a.download=
"mes-paiements-sauvegarde-"+
new Date().toISOString().slice(0,10)+
".json";

document.body.appendChild(a);

a.click();

a.remove();

URL.revokeObjectURL(url);

}

function importData(event){

const file=event.target.files?.[0];

if(!file)return;

const reader=new FileReader();

reader.onload=function(){

try{

const data=JSON.parse(
reader.result
);

if(Array.isArray(data.payments)){

payments=data.payments;

}

if(Array.isArray(data.domiciliations)){

domiciliations=data.domiciliations;

}

savePayments();
saveDomiciliations();

renderPayments();
renderDomiciliations();

alert(
"Importation terminée."
);

}catch(error){

alert(
"Fichier de sauvegarde invalide."
);

}

};

reader.readAsText(file);

event.target.value="";

}

/* =========================================================
   CALCULATRICE
========================================================= */

function calcInput(value){

if(calcValue==="Erreur"){
calcValue="";
}

calcValue+=value;

updateCalcDisplay();

}

function calcClear(){

calcValue="";

updateCalcDisplay();

}

function calcResult(){

if(!calcValue)return;

try{

/*
 Calcul simple.
*/

const safe=calcValue.replace(
/[^0-9+\-*/.()]/g,
""
);

const result=Function(
"return ("+safe+")"
)();

if(!isFinite(result)){

calcValue="Erreur";

}else{

calcValue=String(
Math.round(result*100000000)/100000000
);

}

}catch(e){

calcValue="Erreur";

}

updateCalcDisplay();

}

function updateCalcDisplay(){

document.getElementById(
"calcDisplay"
).textContent=
calcValue||"0";

}
