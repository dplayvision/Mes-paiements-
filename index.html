<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Mes paiements</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
background:#f2f2f7;
color:#111;
}

button,
input,
select,
textarea{
font-family:inherit;
}

button{
cursor:pointer;
}

.hidden{
display:none!important;
}

/* =========================
   PIN
========================= */

#pinScreen{
position:fixed;
inset:0;
background:#f2f2f7;
display:flex;
align-items:center;
justify-content:center;
z-index:9999;
}

.pinBox{
width:90%;
max-width:360px;
background:white;
border-radius:24px;
padding:30px 22px;
text-align:center;
box-shadow:0 10px 35px rgba(0,0,0,.12);
}

.pinBox h1{
margin:0 0 8px;
font-size:26px;
}

.pinBox p{
color:#777;
margin:0 0 20px;
}

#pinInput{
width:100%;
height:52px;
border:1px solid #ddd;
border-radius:14px;
text-align:center;
font-size:25px;
letter-spacing:8px;
outline:none;
}

.pinButton{
margin-top:15px;
width:100%;
height:50px;
border:0;
border-radius:14px;
background:#007aff;
color:white;
font-size:17px;
font-weight:600;
}

/* =========================
   HEADER
========================= */

.header{
background:#007aff;
color:white;
padding:18px 15px 16px;
position:sticky;
top:0;
z-index:100;
box-shadow:0 2px 8px rgba(0,0,0,.12);
}

.headerTitle{
font-size:25px;
font-weight:700;
text-align:center;
}

/* =========================
   CONTENT
========================= */

.container{
max-width:700px;
margin:auto;
padding:15px;
padding-bottom:80px;
}

/* =========================
   SUMMARY
========================= */

.summaryGrid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
margin-bottom:15px;
}

.summaryCard{
background:white;
border-radius:17px;
padding:13px 7px;
text-align:center;
box-shadow:0 1px 4px rgba(0,0,0,.07);
}

.summaryTitle{
font-size:12px;
color:#777;
margin-bottom:5px;
}

.summaryValue{
font-size:17px;
font-weight:700;
}

/* =========================
   TABS
========================= */

.tabs{
display:flex;
background:#e5e5ea;
border-radius:12px;
padding:3px;
margin-bottom:15px;
}

.tab{
flex:1;
border:0;
background:transparent;
padding:10px 5px;
border-radius:9px;
font-size:14px;
font-weight:600;
color:#555;
}

.tab.active{
background:white;
color:#007aff;
box-shadow:0 1px 4px rgba(0,0,0,.12);
}

/* =========================
   SECTIONS
========================= */

.section{
background:white;
border-radius:18px;
padding:15px;
margin-bottom:15px;
box-shadow:0 1px 5px rgba(0,0,0,.07);
}

.sectionTitle{
font-size:19px;
font-weight:700;
margin-bottom:13px;
}

.formGroup{
margin-bottom:11px;
}

.formGroup label{
display:block;
font-size:13px;
font-weight:600;
color:#555;
margin-bottom:5px;
}

.formGroup input,
.formGroup textarea,
.formGroup select{
width:100%;
border:1px solid #d5d5da;
border-radius:11px;
padding:11px 12px;
font-size:16px;
background:white;
outline:none;
}

.formGroup textarea{
min-height:75px;
resize:vertical;
}

.primaryButton{
width:100%;
border:0;
border-radius:12px;
background:#007aff;
color:white;
padding:12px;
font-size:16px;
font-weight:600;
}

.secondaryButton{
width:100%;
border:0;
border-radius:12px;
background:#e5e5ea;
color:#111;
padding:11px;
font-size:15px;
font-weight:600;
}

.dangerButton{
width:100%;
border:0;
border-radius:12px;
background:#ff3b30;
color:white;
padding:11px;
font-size:15px;
font-weight:600;
}

/* =========================
   PAYMENTS
========================= */

.paymentCard{
background:white;
border-radius:18px;
padding:15px;
margin-bottom:12px;
box-shadow:0 1px 5px rgba(0,0,0,.07);
}

.paymentHeader{
display:flex;
justify-content:space-between;
gap:10px;
align-items:flex-start;
}

.paymentName{
font-size:17px;
font-weight:700;
}

.paymentDate{
font-size:12px;
color:#777;
margin-top:3px;
}

.paymentTotal{
font-size:18px;
font-weight:700;
white-space:nowrap;
}

.paymentInfo{
margin-top:12px;
font-size:14px;
color:#555;
line-height:1.6;
}

.amountLine{
display:flex;
justify-content:space-between;
padding:3px 0;
}

.remaining{
color:#ff3b30;
font-weight:700;
}

.paidAmount{
color:#34c759;
font-weight:700;
}

/* =========================
   ECHEANCES PAIEMENT
========================= */

.installments{
margin-top:12px;
border-top:1px solid #eee;
padding-top:8px;
}

.installmentRow{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
padding:9px 0;
border-bottom:1px solid #f0f0f0;
}

.installmentRow:last-child{
border-bottom:0;
}

.installmentLeft{
display:flex;
align-items:center;
gap:9px;
font-size:14px;
}

.installmentLeft input{
width:21px;
height:21px;
accent-color:#007aff;
}

.installmentPaid{
color:#34c759;
font-weight:600;
}

.installmentUnpaid{
color:#555;
}

.paymentButtons{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:7px;
margin-top:12px;
}

.smallButton{
border:0;
border-radius:10px;
padding:9px 5px;
font-size:13px;
font-weight:600;
background:#e5e5ea;
}

.smallButton.blue{
background:#007aff;
color:white;
}

.smallButton.red{
background:#ff3b30;
color:white;
}

.smallButton.green{
background:#34c759;
color:white;
}

/* =========================
   DOMICILIATIONS
========================= */

.domiciliationCard{
background:white;
border-radius:18px;
padding:15px;
margin-bottom:12px;
box-shadow:0 1px 5px rgba(0,0,0,.07);
}

.domHeader{
display:flex;
justify-content:space-between;
gap:10px;
}

.domTitle{
font-size:18px;
font-weight:700;
}

.domMonthly{
font-size:18px;
font-weight:700;
color:#007aff;
white-space:nowrap;
}

.domInfo{
margin-top:10px;
font-size:14px;
line-height:1.65;
color:#555;
}

.domProgress{
margin-top:12px;
height:9px;
background:#e5e5ea;
border-radius:10px;
overflow:hidden;
}

.domProgressBar{
height:100%;
background:#34c759;
border-radius:10px;
}

.domButtons{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:7px;
margin-top:12px;
}

.domButton{
border:0;
border-radius:10px;
padding:10px 5px;
font-size:13px;
font-weight:600;
background:#e5e5ea;
}

.domButton.blue{
background:#007aff;
color:white;
}

.domButton.red{
background:#ff3b30;
color:white;
}

.domButton.green{
background:#34c759;
color:white;
}

/* =========================
   DERNIERE ECHEANCE
========================= */

.checkboxLine{
display:flex;
align-items:center;
gap:9px;
background:#f2f2f7;
border-radius:12px;
padding:11px;
margin:10px 0;
}

.checkboxLine input{
width:21px;
height:21px;
accent-color:#007aff;
}

.checkboxLine span{
font-size:14px;
font-weight:600;
}

.lastInstallmentBox{
display:none;
}

.lastInstallmentBox.visible{
display:block;
}

/* =========================
   MODAL
========================= */

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.45);
display:none;
align-items:flex-end;
justify-content:center;
z-index:500;
}

.modal.show{
display:flex;
}

.modalBox{
width:100%;
max-width:700px;
background:white;
border-radius:22px 22px 0 0;
padding:20px;
max-height:90vh;
overflow:auto;
}

.modalTitle{
font-size:20px;
font-weight:700;
margin-bottom:15px;
}

.modalButtons{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
margin-top:12px;
}

/* =========================
   PHOTO
========================= */

.photoPreview{
margin-top:10px;
max-width:100%;
max-height:250px;
border-radius:12px;
display:block;
}

.photoButtons{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
}

/* =========================
   QR
========================= */

.qrBox{
display:flex;
justify-content:center;
padding:15px;
}

#qrcode{
display:inline-block;
}

/* =========================
   CALCULATRICE
========================= */

.calculator{
background:#1c1c1e;
border-radius:20px;
padding:12px;
}

.calcDisplay{
background:#000;
color:white;
font-size:35px;
text-align:right;
padding:15px 10px;
border-radius:12px;
margin-bottom:10px;
min-height:65px;
overflow:hidden;
}

.calcGrid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:7px;
}

.calcBtn{
border:0;
border-radius:12px;
height:55px;
font-size:21px;
background:#3a3a3c;
color:white;
}

.calcBtn.operator{
background:#ff9500;
}

.calcBtn.equal{
background:#34c759;
}

.calcBtn.clear{
background:#ff3b30;
}

/* =========================
   BACKUP
========================= */

.backupGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
}

/* =========================
   EMPTY
========================= */

.empty{
text-align:center;
color:#888;
padding:25px 10px;
}

hr{
border:0;
border-top:1px solid #eee;
margin:15px 0;
}

@media(max-width:400px){

.summaryValue{
font-size:15px;
}

.paymentButtons,
.domButtons{
grid-template-columns:1fr 1fr;
}

}

</style>
</head>

<body>

<div id="pinScreen">

<div class="pinBox">

<script>

/* ==========================================================
   CONFIGURATION
========================================================== */

const PIN = "1157";

let payments = [];
let domiciliations = [];

let currentTab = "unpaid";

let paymentPhoto = null;


/* ==========================================================
   UTILITAIRES
========================================================== */

function money(value){

return Number(value || 0).toLocaleString(
"fr-BE",
{
minimumFractionDigits:2,
maximumFractionDigits:2
}
) + " €";

}


function escapeHTML(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function uid(){

return Date.now().toString(36)
+
Math.random().toString(36).substring(2,8);

}


function formatDate(date){

if(!date) return "";

const d = new Date(date + "T00:00:00");

if(isNaN(d)) return date;

return d.toLocaleDateString("fr-BE");

}


function round2(value){

return Math.round((Number(value) + Number.EPSILON) * 100) / 100;

}


function addMonthsSafe(dateString, months){

if(!dateString) return "";

const d = new Date(dateString + "T00:00:00");

const day = d.getDate();

d.setDate(1);

d.setMonth(d.getMonth() + Number(months));

const lastDay = new Date(
d.getFullYear(),
d.getMonth()+1,
0
).getDate();

d.setDate(Math.min(day,lastDay));

return d.toISOString().slice(0,10);

}

/* ==========================================================
   NORMALISATION PAIEMENTS
========================================================== */

function normalizePayments(){

payments = payments.map(p => {

let installments =
Number(
p.installments ??
p.echeances ??
1
);

if(!Number.isFinite(installments) || installments < 1){
installments=1;
}

installments=Math.floor(installments);

let paidInstallments =
Array.isArray(p.paidInstallments)
? p.paidInstallments.slice(0,installments)
: null;

if(!paidInstallments){

paidInstallments =
Array(installments).fill(!!p.paid);

}

while(paidInstallments.length < installments){

paidInstallments.push(false);

}

return {

...p,

id:p.id || uid(),

installments:installments,

paidInstallments:paidInstallments

};

});

savePayments();

}


function normalizeDomiciliations(){

domiciliations =
domiciliations.map(d => {

let monthsPaid =
Array.isArray(d.monthsPaid)
? d.monthsPaid
: [];

return {

...d,

id:d.id || uid(),

monthsPaid:monthsPaid,

months:Number(d.months || 1),

total:Number(d.total || 0),

taeg:Number(d.taeg || 0),

lastDifferent:!!d.lastDifferent,

lastInstallment:
d.lastInstallment !== undefined
? Number(d.lastInstallment)
: null

};

});

saveDomiciliations();

}


/* ==========================================================
   PAIEMENTS
========================================================== */

function getInstallmentAmounts(payment){

const total = round2(payment.total);

const count =
Math.max(1,Number(payment.installments || 1));

const base =
round2(total / count);

const amounts=[];

let accumulated=0;

for(let i=0;i<count;i++){

if(i === count-1){

amounts.push(
round2(total - accumulated)
);

}else{

amounts.push(base);

accumulated =
round2(accumulated + base);

}

}

return amounts;

}


function getPaidAmount(payment){

const amounts =
getInstallmentAmounts(payment);

const states =
payment.paidInstallments || [];

let total=0;

amounts.forEach((amount,index)=>{

if(states[index]){
total += amount;
}

});

return round2(total);

}


function isFullyPaid(payment){

const count =
Number(payment.installments || 1);

const states =
payment.paidInstallments || [];

return states.length >= count &&
states.slice(0,count).every(Boolean);

}


function getRemaining(payment){

return round2(
Number(payment.total || 0)
-
getPaidAmount(payment)
);

}

function handlePaymentPhoto(input){

const file=input.files && input.files[0];

if(!file) return;

const reader=new FileReader();

reader.onload=function(e){

const img=new Image();

img.onload=function(){

const canvas=document.createElement("canvas");

const max=1200;

let width=img.width;
let height=img.height;

if(width>max){

height =
height * max / width;

width=max;

}

if(height>max){

width =
width * max / height;

height=max;

}

canvas.width=width;
canvas.height=height;

const ctx=canvas.getContext("2d");

ctx.drawImage(
img,
0,
0,
width,
height
);

paymentPhoto =
canvas.toDataURL(
"image/jpeg",
0.75
);

const preview =
document.getElementById("payPhotoPreview");

preview.src=paymentPhoto;

preview.style.display="block";

};

img.src=e.target.result;

};

reader.readAsDataURL(file);

}

function calculateLoanMonthly(total,months,taeg){

total=Number(total)||0;
months=Number(months)||1;
taeg=Number(taeg)||0;

if(taeg<=0){

return round2(total/months);

}

const monthlyRate =
taeg / 100 / 12;

return round2(
total *
monthlyRate /
(
1 -
Math.pow(
1+monthlyRate,
-months
)
);

}

function calculateDomiciliation(){

const total =
parseFloat(
document.getElementById("domTotal").value
) || 0;

const months =
parseInt(
document.getElementById("domMonths").value
) || 0;

const taeg =
parseFloat(
document.getElementById("domTAEG").value
) || 0;

const lastDifferent =
document.getElementById("domLastDifferent").checked;

let monthly=0;
let last=0;

if(total>0 && months>0){

monthly =
calculateLoanMonthly(
total,
months,
taeg
);

last =
round2(
total -
monthly * (months-1)
);

}

if(lastDifferent){

const entered =
parseFloat(
document.getElementById("domLastInstallment").value
);

if(Number.isFinite(entered) && entered>0){

last=round2(entered);

}

}

const normalMonths =
Math.max(0,months-1);

let normalTotal =
round2(monthly * normalMonths);

let calculatedTotal =
round2(normalTotal + last);

let difference =
round2(total-calculatedTotal);


document.getElementById("domCalculation")
.innerHTML=`

<strong>Calcul :</strong><br>

Mensualité normale :
<strong>${money(monthly)}</strong><br>

Nombre de mensualités normales :
<strong>${normalMonths}</strong><br>

Dernière échéance :
<strong>${money(last)}</strong>

<br>

Total calculé :
<strong>${money(calculatedTotal)}</strong>

${Math.abs(difference)>0.01
? `<br><span style="color:#ff3b30">
Écart : ${money(difference)}
</span>`
: `<br><span style="color:#34c759">
✓ Total correspondant
</span>`
}

`;

}

d.taeg || "";

document.getElementById("editDomStartDate").value =
d.startDate || "";

document.getElementById("editDomLastDifferent").checked =
!!d.lastDifferent;

document.getElementById("editDomLastInstallment").value =
d.lastInstallment || "";

toggleEditLastInstallment();

calculateEditDomiciliation();

document.getElementById("domModal")
.classList.add("show");

}


function toggleEditLastInstallment(){

const checked =
document.getElementById("editDomLastDifferent")
.checked;

document.getElementById("editDomLastInstallmentBox")
.classList.toggle(
"visible",
checked
);

calculateEditDomiciliation();

}


function calculateEditDomiciliation(){

const total =
parseFloat(
document.getElementById("editDomTotal").value
) || 0;

const months =
parseInt(
document.getElementById("editDomMonths").value
) || 0;

const taeg =
parseFloat(
document.getElementById("editDomTAEG").value
) || 0;

const lastDifferent =
document.getElementById("editDomLastDifferent").checked;

const monthly =
total>0 && months>0
? calculateLoanMonthly(total,months,taeg)
:0;

let last =
months>0
? round2(total-monthly*(months-1))
:0;

if(lastDifferent){

const entered =
parseFloat(
document.getElementById("editDomLastInstallment").value
);

if(Number.isFinite(entered) && entered>0){

last=round2(entered);

}

}

document.getElementById("editDomCalculation")
.innerHTML=`

Mensualité normale :
<strong>${money(monthly)}</strong><br>

Dernière échéance :
<strong>${money(last)}</strong>

`;

}


function saveDomiciliationEdit(){

const id =
document.getElementById("editDomId").value;

const d =
domiciliations.find(x=>x.id===id);

if(!d) return;

const oldPaid =
Array.isArray(d.monthsPaid)
? d.monthsPaid
: [];

const months =
Math.max(
1,
parseInt(
document.getElementById("editDomMonths").value
) || 1
);

const lastDifferent =
document.getElementById("editDomLastDifferent")
.checked;

d.alias =
document.getElementById("editDomAlias").value.trim();

d.beneficiary =
document.getElementById("editDomBeneficiary").value.trim();

d.iban =
document.getElementById("editDomIBAN").value.trim();

d.total =
round2(
parseFloat(
document.getElementById("editDomTotal").value
) || 0
);

d.months=months;

d.taeg =
parseFloat(
document.getElementById("editDomTAEG").value
) || 0;

d.startDate =
document.getElementById("editDomStartDate").value;

d.lastDifferent=lastDifferent;

d.lastInstallment =
lastDifferent
? round2(
parseFloat(
document.getElementById("editDomLastInstallment").value
) || 0
)
: null;

d.monthsPaid =
oldPaid.filter(n=>Number(n)<=months);

saveDomiciliations();

closeDomiciliationEdit();

renderDomiciliations();

}


function closeDomiciliationEdit(){

document.getElementById("domModal")
.classList.remove("show");

}


/* ==========================================================
   SUPPRIMER DOMICILIATION
========================================================== */

function deleteDomiciliation(id){

if(!confirm("Supprimer cette domiciliation ?")) return;

domiciliations =
domiciliations.filter(d=>d.id!==id);

saveDomiciliations();

renderDomiciliations();

}


/* ==========================================================
   CALCULATRICE
========================================================== */

let calcValue="0";

function calcInput(value){

if(calcValue==="0" && value!=="."){
calcValue="";
}

calcValue += value;

document.getElementById("calcDisplay")
.textContent =
calcValue.replace(/\./g,",");

}


function calcClear(){

calcValue="0";

document.getElementById("calcDisplay")
.textContent="0";

}


function calcResult(){

try{

if(!/^[0-9+\-*/().\s]+$/.test(calcValue)){
throw new Error();
}

const result =
Function(
'"use strict";return ('+
calcValue+
')'
)();

if(!Number.isFinite(result)){
throw new Error();
}

calcValue =
String(
round2(result)
);

document.getElementById("calcDisplay")
.textContent =
calcValue.replace(/\./g,",");

}catch(e){

calcValue="0";

document.getElementById("calcDisplay")
.textContent="Erreur";

}

}


/* ==========================================================
   EXPORT
========================================================== */

function exportData(){

const data={

version:3,

payments:payments,

domiciliations:domiciliations

};

const blob =
new Blob(
[
JSON.stringify(data,null,2)
],
{
type:"application/json"
}
);

const url =
URL.createObjectURL(blob);

const a =
document.createElement("a");

a.href=url;

a.download =
"mes-paiements-sauvegarde.json";

a.click();

URL.revokeObjectURL(url);

}


/* ==========================================================
   IMPORT
========================================================== */

function importData(input){

const file =
input.files && input.files[0];

if(!file) return;

const reader =
new FileReader();

reader.onload=function(e){

try{

const data =
JSON.parse(e.target.result);

if(Array.isArray(data)){

payments=data;

}else{

if(Array.isArray(data.payments)){
payments=data.payments;
}

if(Array.isArray(data.domiciliations)){
domiciliations=data.domiciliations;
}

}

normalizePayments();

normalizeDomiciliations();

savePayments();

saveDomiciliations();

renderAll();

alert("Sauvegarde importée avec succès.");

}catch(error){

alert("Fichier de sauvegarde invalide.");

}

input.value="";

};

reader.readAsText(file);

}


/* ==========================================================
   RENDER GLOBAL
========================================================== */

function renderAll(){

loadData();

renderPayments();

renderDomiciliations();

updateSummary();

}

</script>
