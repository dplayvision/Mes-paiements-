<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mes Paiements</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f2f7;
    color: #222;
}

header {
    background: #007aff;
    color: white;
    padding: 20px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 25px;
}

.container {
    padding: 15px;
    max-width: 700px;
    margin: auto;
}

button {
    border: none;
    border-radius: 10px;
    padding: 12px 15px;
    font-size: 16px;
    cursor: pointer;
}

.add-btn {
    width: 100%;
    background: #34c759;
    color: white;
    margin-bottom: 15px;
}

.delete-btn {
    width: 100%;
    background: #ff3b30;
    color: white;
    margin-top: 10px;
    display: none;
}

.payment {
    background: white;
    border-radius: 15px;
    padding: 15px;
    margin-bottom: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    display: flex;
    align-items: center;
    gap: 10px;
}

.payment-info {
    flex: 1;
}

.payment-name {
    font-size: 18px;
    font-weight: bold;
}

.payment-date {
    color: #666;
    margin-top: 4px;
}

.payment-amount {
    font-weight: bold;
    margin-top: 5px;
}

.edit-btn {
    background: #e5e5ea;
    padding: 9px 12px;
}

.photo-btn {
    background: #007aff;
    color: white;
    margin-top: 10px;
}

.photo-preview {
    max-width: 100%;
    max-height: 250px;
    border-radius: 10px;
    margin-top: 10px;
    display: none;
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 1000;
    padding: 20px;
    overflow-y: auto;
}

.modal-content {
    background: white;
    max-width: 500px;
    margin: 30px auto;
    padding: 20px;
    border-radius: 20px;
}

.modal h2 {
    margin-top: 0;
}

label {
    display: block;
    margin-top: 12px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 12px;
    margin-top: 6px;
    border: 1px solid #ccc;
    border-radius: 10px;
    font-size: 16px;
}

.save-btn {
    background: #007aff;
    color: white;
    width: 100%;
    margin-top: 18px;
}

.cancel-btn {
    background: #e5e5ea;
    width: 100%;
    margin-top: 10px;
}

.photo-options {
    display: flex;
    gap: 10px;
    margin-top: 10px;
}

.photo-options button {
    flex: 1;
    background: #007aff;
    color: white;
}

.file-input {
    display: none;
}

.empty {
    text-align: center;
    color: #777;
    margin-top: 40px;
}
</style>
</head>

<body>

<header>
    <h1>💶 Mes Paiements</h1>
</header>

<div class="container">

    <button class="add-btn" onclick="openModal()">
        ➕ Ajouter un paiement
    </button>

    <div id="payments"></div>

    <button id="deleteBtn" class="delete-btn" onclick="deleteSelected()">
        🗑️ Supprimer la sélection
    </button>

</div>

<!-- MODALE -->
<div id="modal" class="modal">

    <div class="modal-content">

        <h2 id="modalTitle">Ajouter un paiement</h2>

        <label>Nom du paiement</label>
        <input type="text" id="name" placeholder="Ex : Électricité">

        <label>Montant (€)</label>
        <input type="number" id="amount" step="0.01" placeholder="Ex : 120">

        <label>Date</label>
        <input type="date" id="date">

        <label>Photo du document</label>

        <div class="photo-options">

            <!-- Prendre une photo avec l'appareil -->
            <button type="button" onclick="takePhoto()">
                📷 Prendre une photo
            </button>

            <!-- Choisir dans les photos du téléphone -->
            <button type="button" onclick="choosePhoto()">
                🖼️ Mes photos
            </button>

        </div>

        <!-- Input appareil photo -->
        <input
            type="file"
            id="cameraInput"
            class="file-input"
            accept="image/*"
            capture="environment"
            onchange="photoSelected(event)"
        >

        <!-- Input galerie -->
        <input
            type="file"
            id="galleryInput"
            class="file-input"
            accept="image/*"
            onchange="photoSelected(event)"
        >

        <img id="photoPreview" class="photo-preview">

        <button class="save-btn" onclick="savePayment()">
            💾 Enregistrer
        </button>

        <button class="cancel-btn" onclick="closeModal()">
            Annuler
        </button>

    </div>

</div>

<script>

let payments = JSON.parse(localStorage.getItem("payments")) || [];

let editIndex = null;
let selectedPhoto = null;

/* AFFICHAGE */

function displayPayments() {

    const container = document.getElementById("payments");

    container.innerHTML = "";

    if (payments.length === 0) {

        container.innerHTML =
            '<div class="empty">Aucun paiement enregistré.</div>';

        document.getElementById("deleteBtn").style.display = "none";

        return;
    }

    payments.forEach((payment, index) => {

        const div = document.createElement("div");

        div.className = "payment";

        div.innerHTML = `

            <input
                type="checkbox"
                class="selectPayment"
                data-index="${index}"
                onchange="updateDeleteButton()"
            >

            <div class="payment-info">

                <div class="payment-name">
                    ${escapeHtml(payment.name)}
                </div>

                <div class="payment-date">
                    📅 ${payment.date || "Date non indiquée"}
                </div>

                <div class="payment-amount">
                    💶 ${Number(payment.amount).toFixed(2)} €
                </div>

                ${
                    payment.photo
                    ?
                    `<img
                        src="${payment.photo}"
                        class="photo-preview"
                        style="display:block"
                    >`
                    :
                    ""
                }

            </div>

            <button
                class="edit-btn"
                onclick="editPayment(${index})"
            >
                ✏️
            </button>

        `;

        container.appendChild(div);
    });

    updateDeleteButton();
}

/* AJOUT */

function openModal() {

    editIndex = null;
    selectedPhoto = null;

    document.getElementById("modalTitle").innerText =
        "Ajouter un paiement";

    document.getElementById("name").value = "";
    document.getElementById("amount").value = "";
    document.getElementById("date").value = "";

    document.getElementById("photoPreview").style.display = "none";
    document.getElementById("photoPreview").src = "";

    document.getElementById("modal").style.display = "block";
}

/* MODIFICATION */

function editPayment(index) {

    editIndex = index;

    const payment = payments[index];

    selectedPhoto = payment.photo || null;

    document.getElementById("modalTitle").innerText =
        "Modifier le paiement";

    document.getElementById("name").value =
        payment.name;

    document.getElementById("amount").value =
        payment.amount;

    document.getElementById("date").value =
        payment.date;

    const preview =
        document.getElementById("photoPreview");

    if (payment.photo) {

        preview.src = payment.photo;
        preview.style.display = "block";

    } else {

        preview.style.display = "none";

    }

    document.getElementById("modal").style.display = "block";
}

/* FERMER */

function closeModal() {

    document.getElementById("modal").style.display = "none";
}

/* PHOTO APPAREIL */

function takePhoto() {

    document.getElementById("cameraInput").click();
}

/* PHOTO GALERIE */

function choosePhoto() {

    document.getElementById("galleryInput").click();
}

/* PHOTO SÉLECTIONNÉE */

function photoSelected(event) {

    const file = event.target.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = function(e) {

        selectedPhoto = e.target.result;

        const preview =
            document.getElementById("photoPreview");

        preview.src = selectedPhoto;
        preview.style.display = "block";

    };

    reader.readAsDataURL(file);
}

/* SAUVEGARDER */

function savePayment() {

    const name =
        document.getElementById("name").value.trim();

    const amount =
        document.getElementById("amount").value;

    const date =
        document.getElementById("date").value;

    if (!name) {

        alert("Merci d'indiquer le nom du paiement.");

        return;
    }

    if (!amount) {

        alert("Merci d'indiquer le montant.");

        return;
    }

    const payment = {

        name: name,

        amount: parseFloat(amount),

        date: date,

        photo: selectedPhoto

    };

    if (editIndex === null) {

        payments.push(payment);

    } else {

        payments[editIndex] = payment;

    }

    localStorage.setItem(
        "payments",
        JSON.stringify(payments)
    );

    closeModal();

    displayPayments();
}

/* SUPPRESSION */

function updateDeleteButton() {

    const checked =
        document.querySelectorAll(
            ".selectPayment:checked"
        ).length;

    document.getElementById("deleteBtn").style.display =
        checked > 0 ? "block" : "none";
}

function deleteSelected() {

    const selected =
        Array.from(
            document.querySelectorAll(
                ".selectPayment:checked"
            )
        ).map(cb => Number(cb.dataset.index));

    if (selected.length === 0) return;

    if (!confirm(
        "Supprimer les paiements sélectionnés ?"
    )) return;

    payments =
        payments.filter(
            (_, index) => !selected.includes(index)
        );

    localStorage.setItem(
        "payments",
        JSON.stringify(payments)
    );

    displayPayments();
}

/* SÉCURITÉ AFFICHAGE */

function escapeHtml(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}

/* DÉMARRAGE */

displayPayments();

</script>

</body>
</html>
