name: Rappels Mes paiements

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# Évite deux workers simultanés (cron + lancement manuel).
concurrency:
  group: rappels-mes-paiements
  cancel-in-progress: false

jobs:
  envoyer-rappels:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: |
          cd push-worker
          npm install

      - name: Envoyer les rappels
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          OWNER_UID: pLAvsCmVU1e8SXjy77nNR5DnmpN2
        run: |
          cd push-worker
          node index.js
